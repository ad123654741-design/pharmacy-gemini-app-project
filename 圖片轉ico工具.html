<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖片轉ICO轉換器 (多重解析度)</title>
    <!-- 載入 Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 使用 Inter 字體 */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(circle at top, #f8fafc 0%, #edf2f7 100%);
        }
        /* 隱藏用於繪圖的 Canvas */
        .hidden-canvas {
            position: absolute;
            left: -9999px;
            top: -9999px;
            visibility: hidden;
        }
        /* 棋盤格透明背景，用於精準呈現透明圖示 */
        .transparency-grid {
            background-color: #ffffff;
            background-image: linear-gradient(45deg, #f1f5f9 25%, transparent 25%),
                              linear-gradient(-45deg, #f1f5f9 25%, transparent 25%),
                              linear-gradient(45deg, transparent 75%, #f1f5f9 75%),
                              linear-gradient(-45deg, transparent 75%, #f1f5f9 75%);
            background-size: 12px 12px;
            background-position: 0 0, 0 6px, 6px -6px, -6px 0px;
        }
        /* 平滑進場動畫 */
        .fade-in {
            animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px) scale(0.99); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        /* 骨架屏載入微動畫 */
        .skeleton-shimmer {
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="p-4 sm:p-8 min-h-screen flex items-center justify-center antialiased text-gray-800 selection:bg-indigo-500 selection:text-white">

    <div class="w-full max-w-2xl bg-white/95 backdrop-blur-md shadow-[0_20px_50px_rgba(0,0,0,0.06)] hover:shadow-[0_25px_60px_rgba(79,70,229,0.08)] rounded-3xl p-6 sm:p-10 border border-slate-100/80 transition-all duration-500">
        <div class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-gray-900 tracking-tight mb-3">
                高畫質圖片轉 <span class="bg-gradient-to-r from-indigo-600 via-indigo-700 to-indigo-500 bg-clip-text text-transparent">ICO</span> 工具
            </h1>
            <p class="text-sm sm:text-base text-gray-500 max-w-md mx-auto leading-relaxed">請選擇 PNG, JPG 或 SVG 圖片。工具會自動產生多重解析度的 `.ico` 檔案。</p>
        </div>

        <!-- 檔案輸入區域 -->
        <div class="mb-7" id="drop-zone-container">
            <label for="image-input" class="block text-sm font-semibold text-gray-700 mb-2.5">
                選擇圖片檔案 (PNG, JPG, SVG)
            </label>
            <div id="drop-zone" class="relative border-2 border-dashed border-slate-200 hover:border-indigo-400 rounded-2xl transition-all duration-300 p-7 bg-slate-50/60 hover:bg-indigo-50/30 group text-center cursor-pointer shadow-inner">
                <!-- 點擊重設 value，避免二次選擇同名檔案時不觸發 onchange -->
                <input type="file" id="image-input" accept="image/png, image/jpeg, image/svg+xml"
                    class="block w-full text-sm text-gray-500
                    file:mr-4 file:py-2.5 file:px-5 file:transition-all file:duration-200
                    file:rounded-xl file:border-0
                    file:text-sm file:font-semibold file:shadow-sm hover:file:shadow
                    file:bg-indigo-50 file:text-indigo-600
                    hover:file:bg-indigo-100 hover:file:scale-[1.02] cursor-pointer"
                    onclick="this.value = null;"
                    onchange="handleImageSelection()">
                <p class="text-xs sm:text-sm text-gray-400 mt-3 font-medium transition-colors group-hover:text-indigo-600">或支援直接拖曳圖片至此區域 (Drag & Drop)</p>
            </div>
        </div>

        <!-- 非正方形警告 (預設隱藏) -->
        <div id="aspect-warning" class="hidden mb-6 p-4 bg-amber-50/80 rounded-2xl border border-amber-200/80 flex items-center shadow-sm transition-all duration-300">
            <svg class="w-5 h-5 text-amber-500 mr-3 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
            <p class="text-xs sm:text-sm text-amber-800 font-medium leading-normal">提醒您：上傳的圖片非正方形，轉換後可能會產生變形</p>
        </div>

        <!-- 預覽與資訊 -->
        <div id="preview-area" class="hidden flex flex-col items-center justify-center p-6 bg-slate-50/80 border border-slate-200/80 rounded-2xl mb-7 shadow-sm transition-all duration-300">
            <h2 class="text-sm font-bold tracking-wide uppercase text-gray-400 mb-4">預覽圖</h2>
            <div class="flex items-end justify-center space-x-6 sm:space-x-8 mb-4">
                <div class="flex flex-col items-center group">
                    <div class="transparency-grid rounded-xl p-1.5 border border-slate-200 shadow-sm transition-transform duration-300 group-hover:scale-110 group-hover:shadow-md">
                        <img id="img-preview-16" class="w-6 h-6 object-contain" alt="16x16 預覽" title="16x16 Favicon">
                    </div>
                    <span class="text-xs text-gray-500 mt-2 font-medium">16x16</span>
                </div>
                <div class="flex flex-col items-center group">
                    <div class="transparency-grid rounded-xl p-1.5 border border-slate-200 shadow-sm transition-transform duration-300 group-hover:scale-110 group-hover:shadow-md">
                        <img id="img-preview-32" class="w-10 h-10 object-contain" alt="32x32 預覽" title="32x32 任務欄圖示">
                    </div>
                    <span class="text-xs text-gray-500 mt-2 font-medium">32x32</span>
                </div>
                <div class="flex flex-col items-center group">
                    <div class="transparency-grid rounded-2xl p-2 border border-slate-200 shadow-sm transition-transform duration-300 group-hover:scale-110 group-hover:shadow-md">
                        <img id="img-preview-48" class="w-14 h-14 object-contain" alt="48x48 預覽" title="48x48 桌面圖示">
                    </div>
                    <span class="text-xs text-gray-500 mt-2 font-medium">48x48</span>
                </div>
            </div>
            <p id="file-info" class="text-xs sm:text-sm text-gray-600 font-medium bg-white px-3.5 py-1.5 rounded-full shadow-sm border border-slate-100"></p>
        </div>

        <!-- 自訂選項區域 -->
        <div class="mb-7 bg-slate-50/70 p-6 rounded-2xl border border-slate-200/70 shadow-sm transition-all duration-300 hover:shadow-md hover:border-indigo-100">
            <div class="mb-5">
                <label class="block text-sm font-semibold text-gray-700 mb-3">選擇包含的解析度 (多選)</label>
                <div class="flex flex-wrap gap-3 sm:gap-4" id="size-checkboxes">
                    <label class="inline-flex items-center px-3 py-1.5 bg-white rounded-xl border border-slate-200 shadow-sm hover:border-indigo-300 cursor-pointer transition-all duration-200 hover:shadow">
                        <input type="checkbox" value="16" checked class="rounded text-indigo-600 focus:ring-indigo-500 h-4 w-4">
                        <span class="ml-2 text-xs sm:text-sm font-medium text-gray-700">16x16</span>
                    </label>
                    <label class="inline-flex items-center px-3 py-1.5 bg-white rounded-xl border border-slate-200 shadow-sm hover:border-indigo-300 cursor-pointer transition-all duration-200 hover:shadow">
                        <input type="checkbox" value="32" checked class="rounded text-indigo-600 focus:ring-indigo-500 h-4 w-4">
                        <span class="ml-2 text-xs sm:text-sm font-medium text-gray-700">32x32</span>
                    </label>
                    <label class="inline-flex items-center px-3 py-1.5 bg-white rounded-xl border border-slate-200 shadow-sm hover:border-indigo-300 cursor-pointer transition-all duration-200 hover:shadow">
                        <input type="checkbox" value="48" checked class="rounded text-indigo-600 focus:ring-indigo-500 h-4 w-4">
                        <span class="ml-2 text-xs sm:text-sm font-medium text-gray-700">48x48</span>
                    </label>
                    <label class="inline-flex items-center px-3 py-1.5 bg-white rounded-xl border border-slate-200 shadow-sm hover:border-indigo-300 cursor-pointer transition-all duration-200 hover:shadow">
                        <input type="checkbox" value="64" class="rounded text-indigo-600 focus:ring-indigo-500 h-4 w-4">
                        <span class="ml-2 text-xs sm:text-sm font-medium text-gray-700">64x64</span>
                    </label>
                    <label class="inline-flex items-center px-3 py-1.5 bg-white rounded-xl border border-slate-200 shadow-sm hover:border-indigo-300 cursor-pointer transition-all duration-200 hover:shadow">
                        <input type="checkbox" value="128" class="rounded text-indigo-600 focus:ring-indigo-500 h-4 w-4">
                        <span class="ml-2 text-xs sm:text-sm font-medium text-gray-700">128x128</span>
                    </label>
                    <label class="inline-flex items-center px-3 py-1.5 bg-white rounded-xl border border-slate-200 shadow-sm hover:border-indigo-300 cursor-pointer transition-all duration-200 hover:shadow">
                        <input type="checkbox" value="256" class="rounded text-indigo-600 focus:ring-indigo-500 h-4 w-4">
                        <span class="ml-2 text-xs sm:text-sm font-medium text-gray-700">256x256</span>
                    </label>
                </div>
                <p class="text-xs text-gray-400 mt-2.5 leading-relaxed">提示：勾選越多尺寸，生成的 ICO 檔案會越大，但能提供更完美的跨設備體驗。</p>
            </div>
            <div>
                <label for="filename-input" class="block text-sm font-semibold text-gray-700 mb-2">自訂匯出檔名</label>
                <div class="flex items-center max-w-sm">
                    <input type="text" id="filename-input" value="favicon" class="flex-1 block w-full rounded-xl border border-slate-300/80 shadow-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 text-sm px-3.5 py-2.5 transition duration-200 outline-none" placeholder="輸入檔名">
                    <span class="ml-3 text-sm text-gray-500 font-semibold">.ico</span>
                </div>
            </div>
        </div>

        <!-- 轉換按鈕與結果區域 -->
        <div class="flex flex-col space-y-4">
            <div class="flex flex-col sm:flex-row space-y-3 sm:space-y-0 sm:space-x-4">
                <button id="convert-button" onclick="startConversion()" disabled
                    class="flex-1 py-3.5 px-6 bg-gradient-to-r from-indigo-600 to-indigo-700 text-white font-semibold rounded-xl shadow-md hover:shadow-lg hover:from-indigo-500 hover:to-indigo-600 transition-all duration-200 hover:-translate-y-0.5 active:translate-y-0 active:scale-[0.98] disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:translate-y-0 disabled:hover:shadow-none disabled:active:scale-100">
                    點擊轉換成 ICO 檔案
                </button>
                <button id="clear-button" onclick="resetState()" class="hidden sm:w-auto w-full py-3.5 px-6 bg-white text-gray-700 border border-slate-200 font-semibold rounded-xl shadow-sm hover:bg-slate-50 hover:shadow hover:border-slate-300 transition-all duration-200 hover:-translate-y-0.5 active:translate-y-0 active:scale-[0.98]">
                    清除重設
                </button>
            </div>
            <div id="status-message" class="hidden transition-all duration-300">
                <div class="flex flex-row items-center justify-center text-sm text-indigo-600 py-3 px-4 bg-indigo-50/70 rounded-xl border border-indigo-100/80 shadow-sm">
                    <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span id="status-text" class="font-medium">正在處理中，請稍候...</span>
                </div>
            </div>
            <div id="download-area" class="hidden text-center p-4 bg-emerald-50/90 rounded-2xl border border-emerald-200/80 shadow-sm transition-all duration-300">
                <a id="download-link" href="#" download="favicon.ico"
                    class="text-emerald-700 font-semibold hover:text-emerald-800 transition-all duration-200 flex items-center justify-center hover:scale-[1.01] active:scale-[0.99] text-sm sm:text-base">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    轉換完成！點此下載 favicon.ico
                </a>
            </div>
        </div>

        <!-- 繪圖用的 Canvas (隱藏) -->
        <canvas id="conversion-canvas" class="hidden-canvas"></canvas>
    </div>

    <script>
        const imageInput = document.getElementById('image-input');
        const convertButton = document.getElementById('convert-button');
        const previewArea = document.getElementById('preview-area');
        const downloadArea = document.getElementById('download-area');
        const downloadLink = document.getElementById('download-link');
        const statusMessage = document.getElementById('status-message');
        const canvas = document.getElementById('conversion-canvas');
        const ctx = canvas.getContext('2d');
        
        let originalImage = null;
        let currentBlobUrl = null; // 記錄目前建立的 Object URL，供即時銷毀防快取

        // --- 拖曳上傳 (Drag & Drop) 功能 ---
        const dropZone = document.getElementById('drop-zone');
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });
        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('border-indigo-500', 'bg-indigo-50/50'), false);
        });
        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('border-indigo-500', 'bg-indigo-50/50'), false);
        });
        dropZone.addEventListener('drop', handleDrop, false);
        
        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            if (files && files.length > 0) {
                // 清理舊的狀態後指派新檔案
                resetOldExportState();
                imageInput.files = files;
                handleImageSelection();
            }
        }

        // --- 核心修復：清理上一次匯出的狀態與記憶體，避免快取舊圖 ---
        function resetOldExportState() {
            if (currentBlobUrl) {
                URL.revokeObjectURL(currentBlobUrl);
                currentBlobUrl = null;
            }
            downloadLink.removeAttribute('href');
            downloadArea.classList.add('hidden');
            downloadArea.classList.remove('fade-in');
        }

        // --- 清除按鈕重設功能 ---
        function resetState() {
            imageInput.value = '';
            originalImage = null;
            resetOldExportState();
            
            // 隱藏各個區塊並移除動畫 class
            previewArea.classList.add('hidden');
            previewArea.classList.remove('fade-in');
            document.getElementById('aspect-warning').classList.add('hidden');
            document.getElementById('aspect-warning').classList.remove('fade-in');
            statusMessage.classList.add('hidden');
            document.getElementById('clear-button').classList.add('hidden');
            document.getElementById('clear-button').classList.remove('fade-in');
            
            convertButton.disabled = true;
            document.getElementById('filename-input').value = 'favicon';
            
            // 重置預覽圖片 src 與釋放 Canvas 記憶體
            const ids = ['img-preview-16', 'img-preview-32', 'img-preview-48'];
            ids.forEach(id => {
                const elem = document.getElementById(id);
                elem.src = '';
                elem.removeAttribute('src');
            });
            
            canvas.width = 1;
            canvas.height = 1;
            ctx.clearRect(0, 0, 1, 1);
        }

        // 取得使用者選擇的尺寸清單
        function getSelectedSizes() {
            const checkboxes = document.querySelectorAll('#size-checkboxes input[type="checkbox"]:checked');
            return Array.from(checkboxes).map(cb => parseInt(cb.value)).sort((a, b) => a - b);
        }

        /**
         * 將 Base64 資料轉換為 ArrayBuffer
         */
        function base64ToArrayBuffer(base64) {
            const binaryString = atob(base64.split(',')[1]);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes.buffer;
        }

        /**
         * 將圖片縮放並繪製到 Canvas，然後取得 PNG ArrayBuffer
         */
        function getPngData(size) {
            return new Promise(resolve => {
                canvas.width = size;
                canvas.height = size;
                ctx.clearRect(0, 0, size, size);

                // 啟用高品質圖片平滑縮放
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';

                // 繪製圖片並縮放
                ctx.drawImage(originalImage, 0, 0, size, size);

                // 取得 PNG 資料 URL
                const dataUrl = canvas.toDataURL('image/png');
                resolve(base64ToArrayBuffer(dataUrl));
            });
        }

        /**
         * 將多個 PNG ArrayBuffer 封裝成一個 ICO 檔案 (核心二進位結構)
         */
        function createIcoFile(pngBuffers, sizes) {
            const numImages = sizes.length;
            const imageSizeData = [];
            pngBuffers.forEach((buffer, index) => {
                imageSizeData.push({
                    size: sizes[index],
                    length: buffer.byteLength
                });
            });

            // 1. 計算總檔案大小和偏移量
            let offset = 6 + (numImages * 16);
            let totalLength = offset;

            for (const data of imageSizeData) {
                data.offset = offset;
                totalLength += data.length;
                offset += data.length;
            }

            // 2. 建立總 ArrayBuffer 和 DataView
            const icoBuffer = new ArrayBuffer(totalLength);
            const view = new DataView(icoBuffer);
            let byteOffset = 0;

            // 3. 寫入 ICONDIR (Header) - 6 bytes
            view.setUint16(byteOffset, 0, true); byteOffset += 2;
            view.setUint16(byteOffset, 1, true); byteOffset += 2;
            view.setUint16(byteOffset, numImages, true); byteOffset += 2;

            // 4. 寫入 ICONDIRENTRY (Directory Entries) - N * 16 bytes
            for (let i = 0; i < numImages; i++) {
                const data = imageSizeData[i];
                const dim = data.size === 256 ? 0 : data.size;
                
                view.setUint8(byteOffset, dim); byteOffset += 1;
                view.setUint8(byteOffset, dim); byteOffset += 1;
                view.setUint8(byteOffset, 0); byteOffset += 1;
                view.setUint8(byteOffset, 0); byteOffset += 1;
                view.setUint16(byteOffset, 0, true); byteOffset += 2;
                view.setUint16(byteOffset, 32, true); byteOffset += 2;
                view.setUint32(byteOffset, data.length, true); byteOffset += 4;
                view.setUint32(byteOffset, data.offset, true); byteOffset += 4;
            }

            // 5. 寫入 PNG Data
            const icoBytes = new Uint8Array(icoBuffer);
            for (let i = 0; i < numImages; i++) {
                const data = imageSizeData[i];
                const pngBytes = new Uint8Array(pngBuffers[i]);
                icoBytes.set(pngBytes, data.offset);
            }

            return new Blob([icoBuffer], { type: 'image/x-icon' });
        }

        /**
         * 處理檔案選擇事件
         */
        function handleImageSelection() {
            // 每次載入新圖片時，務必先行清除舊下載連結與已快取的狀態
            resetOldExportState();
            
            convertButton.disabled = true;
            previewArea.classList.add('hidden');
            previewArea.classList.remove('fade-in');
            document.getElementById('aspect-warning').classList.add('hidden');
            originalImage = null;

            const file = imageInput.files[0];
            if (!file) return;

            if (file.type !== 'image/png' && file.type !== 'image/jpeg' && file.type !== 'image/svg+xml') {
                document.getElementById('file-info').textContent = '錯誤：請選擇 PNG, JPG 或 SVG 檔案。';
                previewArea.classList.remove('hidden');
                previewArea.classList.add('fade-in');
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    originalImage = img;
                    convertButton.disabled = false;
                    displayPreviews(img);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        /**
         * 顯示不同尺寸的預覽圖
         */
        function displayPreviews(img) {
            previewArea.classList.remove('hidden');
            previewArea.classList.add('fade-in');
            
            const clearBtn = document.getElementById('clear-button');
            clearBtn.classList.remove('hidden');
            clearBtn.classList.add('fade-in');
            
            // 檢查是否為正方形
            const aspectWarning = document.getElementById('aspect-warning');
            if (img.width !== img.height) {
                aspectWarning.classList.remove('hidden');
                aspectWarning.classList.add('fade-in');
            } else {
                aspectWarning.classList.add('hidden');
                aspectWarning.classList.remove('fade-in');
            }

            document.getElementById('file-info').textContent = `原始圖片尺寸: ${img.width}x${img.height} 像素`;

            const sizes = [16, 32, 48];
            const ids = ['img-preview-16', 'img-preview-32', 'img-preview-48'];

            sizes.forEach((size, index) => {
                const previewImg = document.getElementById(ids[index]);
                canvas.width = size;
                canvas.height = size;
                ctx.clearRect(0, 0, size, size);
                
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                
                ctx.drawImage(img, 0, 0, size, size);
                previewImg.src = canvas.toDataURL('image/png');
            });
        }

        /**
         * 開始轉換流程
         */
        async function startConversion() {
            if (!originalImage) return;

            const selectedSizes = getSelectedSizes();
            if (selectedSizes.length === 0) {
                return;
            }

            // 確保轉換開始前清除先前的 Blob URL
            resetOldExportState();

            convertButton.disabled = true;
            document.getElementById('status-text').textContent = '正在處理中，請稍候...';
            document.getElementById('status-text').classList.remove('text-red-500');
            statusMessage.classList.remove('hidden');
            statusMessage.classList.add('fade-in');

            try {
                // 1. 取得所有目標尺寸的 PNG 資料 (ArrayBuffer 形式)
                const pngBuffers = [];
                for (const size of selectedSizes) {
                    const buffer = await getPngData(size);
                    pngBuffers.push(buffer);
                }

                // 2. 封裝成 ICO 檔案 Blob
                const icoBlob = createIcoFile(pngBuffers, selectedSizes);

                // 3. 建立全域管控的下載連結
                currentBlobUrl = URL.createObjectURL(icoBlob);
                
                // 取得自訂檔名
                let filename = document.getElementById('filename-input').value.trim();
                if (!filename) filename = 'favicon';
                
                downloadLink.href = currentBlobUrl;
                downloadLink.download = `${filename}.ico`;
                downloadLink.innerHTML = `<svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    轉換完成！點此下載 ${filename}.ico`;
                
                downloadArea.classList.remove('hidden');
                downloadArea.classList.add('fade-in');

            } catch (error) {
                console.error("ICO 轉換失敗:", error);
                document.getElementById('status-text').textContent = '轉換過程中發生錯誤，請檢查檔案格式。';
                document.getElementById('status-text').classList.add('text-red-500');
            } finally {
                convertButton.disabled = false;
                if (!document.getElementById('status-text').classList.contains('text-red-500')){
                    statusMessage.classList.add('hidden');
                }
            }
        }
    </script>
</body>
</html>
