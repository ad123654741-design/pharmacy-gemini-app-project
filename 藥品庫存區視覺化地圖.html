<!DOCTYPE html>
<html lang="zh-TW" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧藥品庫存視覺化系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['"Noto Sans TC"', 'sans-serif'] },
                    colors: {
                        primary: '#0ea5e9',
                        primaryDark: '#0284c7',
                        secondary: '#f8fafc',
                        darkBg: '#0f172a',
                        darkCard: '#1e293b'
                    }
                }
            }
        }
    </script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #f1f5f9; transition: background-color 0.3s; }
        .dark body { background-color: #0f172a; }
        
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; transition: filter 0.3s ease; }
        
        .ui-layer { position: absolute; z-index: 10; pointer-events: none; }
        .interactive { pointer-events: auto; }
        
        /* 隱藏捲軸 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 右上角小地圖 */
        #minimap {
            position: absolute; top: 20px; right: 20px;
            width: 176px; height: 154px; /* 對應 w-44 h-[154px] */
            background: rgba(255,255,255,0.9); border: 2px solid #cbd5e1;
            border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            pointer-events: auto; cursor: pointer; transition: all 0.3s ease;
            backdrop-filter: blur(4px); overflow: hidden;
        }
        .dark #minimap { background: rgba(30,41,59,0.9); border-color: #334155; }
        #minimap:hover { transform: scale(1.02); border-color: #94a3b8; }
        
        .rack-minimap {
            position: absolute; border: 1.5px solid #1e293b; background: white;
            transition: all 0.3s ease; border-radius: 2px;
        }
        .dark .rack-minimap { border-color: #94a3b8; background: #334155; }
        .rack-minimap.active {
            background-color: #3b82f6 !important; border-color: #2563eb !important;
            box-shadow: 0 0 10px rgba(59,130,246,0.6); transform: scale(1.05); z-index: 10;
        }
        .rack-minimap.searched {
            background-color: #ef4444 !important; border-color: #dc2626 !important;
            box-shadow: 0 0 10px rgba(239,68,68,0.6); z-index: 10; animation: pulseRed 2s infinite;
        }

        /* 3D 標籤 */
        .rack-label-3d {
            position: absolute; background: rgba(15,23,42,0.85); color: white;
            padding: 4px 12px; border-radius: 20px; font-size: 14px; font-weight: bold;
            pointer-events: auto; cursor: pointer; transform: translate(-50%, -50%);
            border: 2px solid rgba(255,255,255,0.2); backdrop-filter: blur(4px);
            transition: all 0.2s ease; user-select: none; box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            white-space: nowrap;
        }
        .dark .rack-label-3d { background: rgba(255,255,255,0.9); color: #0f172a; border-color: rgba(0,0,0,0.1); }
        .rack-label-3d:hover { transform: translate(-50%, -50%) scale(1.1); background: #0ea5e9; border-color: white; }
        .rack-label-3d.active-label { background: #10b981; border-color: white; transform: translate(-50%, -50%) scale(1.15); box-shadow: 0 0 15px rgba(16,185,129,0.5); }

        /* 左側清單藥品項目 hover 效果 */
        .med-item { border: 1px solid transparent; transition: all 0.2s ease; }
        .med-item:hover { border-color: #bae6fd; transform: translateX(4px); background: #f0f9ff; }
        .dark .med-item:hover { border-color: #0369a1; background: #0c4a6e; }
        
        .med-item.selected-item { border-color: #38bdf8; background: #e0f2fe; border-left: 4px solid #0ea5e9; }
        .dark .med-item.selected-item { border-color: #0284c7; background: #164e63; border-left-color: #38bdf8; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        
        @keyframes pulseRed { 0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.7); } 70% { box-shadow: 0 0 0 10px rgba(239,68,68,0); } 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); } }
        @keyframes slideInLeft { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
        
        /* 載入動畫 */
        #loader { transition: opacity 0.5s ease; }
        .spinner { width: 50px; height: 50px; border: 5px solid #e2e8f0; border-top-color: #0ea5e9; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 重置視角按鈕 */
        #resetViewBtn {
            position: absolute; bottom: 30px; right: 30px; width: 48px; height: 48px;
            background: white; border-radius: 50%; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); cursor: pointer; transition: all 0.2s ease; color: #475569;
        }
        .dark #resetViewBtn { background: #1e293b; color: #cbd5e1; }
        #resetViewBtn:hover { transform: scale(1.1) rotate(-15deg); color: #0ea5e9; box-shadow: 0 6px 20px rgba(14,165,233,0.3); }

    </style>
</head>
<body class="text-slate-800 dark:text-slate-200 antialiased selection:bg-primary/30">

    <!-- 載入畫面 -->
    <div id="loader" class="fixed inset-0 bg-white dark:bg-slate-900 z-50 flex flex-col items-center justify-center">
        <div class="spinner mb-6"></div>
        <div class="text-xl font-bold text-slate-700 dark:text-slate-200 tracking-wider">初始化 3D 庫存環境...</div>
        <div class="text-sm text-slate-500 mt-2" id="loadingText">正在載入模型資料</div>
    </div>

    <!-- 3D 畫布容器 -->
    <div id="canvas-container"></div>
    <div id="labels-container" class="absolute inset-0 pointer-events-none z-10"></div>

    <!-- UI 覆蓋層 -->
    <div class="ui-layer inset-0 flex flex-col md:flex-row pointer-events-none">
        
        <!-- 左側主面板 -->
        <div class="interactive w-full md:w-96 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md shadow-2xl flex flex-col h-screen border-r border-slate-200/50 dark:border-slate-700/50 transition-all duration-300 z-20 shrink-0" id="leftPanel">
            
            <!-- 面板頂部 (搜尋與控制) -->
            <div class="p-5 border-b border-slate-100 dark:border-slate-800/80 bg-slate-50/50 dark:bg-slate-800/30">
                <div class="flex justify-between items-center mb-5">
                    <h1 class="text-xl font-black tracking-tight text-slate-800 dark:text-white flex items-center gap-2">
                        <div class="w-8 h-8 rounded-lg bg-primary flex items-center justify-center text-white shadow-lg shadow-primary/30">
                            <i data-lucide="pill" class="w-5 h-5"></i>
                        </div>
                        智慧庫存系統
                    </h1>
                    <div class="flex gap-2">
                        <button onclick="Controllers.toggleTheme()" class="p-2 rounded-full hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-500 dark:text-slate-400 transition-colors" title="切換深淺色">
                            <i data-lucide="moon" class="w-5 h-5" id="themeIcon"></i>
                        </button>
                        <button onclick="DOM.toggleAdmin()" class="p-2 rounded-full hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-500 dark:text-slate-400 transition-colors" title="管理員設定">
                            <i data-lucide="settings" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>

                <!-- 搜尋框 -->
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i data-lucide="search" class="w-5 h-5 text-slate-400 group-focus-within:text-primary transition-colors"></i>
                    </div>
                    <input type="text" id="searchInput" placeholder="搜尋藥品代碼、名稱或中文..." 
                           class="w-full pl-10 pr-10 py-3 bg-white dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:border-primary dark:focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all text-sm placeholder-slate-400 font-medium">
                    <button id="clearSearchBtn" onclick="Controllers.clearSearch()" class="absolute inset-y-0 right-0 pr-3 flex items-center hidden text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                        <i data-lucide="x-circle" class="w-5 h-5"></i>
                    </button>
                </div>

                <div id="statusMessage" class="mt-4 text-sm text-slate-500 dark:text-slate-400 hidden md:flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-slate-300 dark:bg-slate-600 inline-block" id="statusDot"></span>
                    <span id="statusText">顯示所有藥品清單</span>
                </div>

                <!-- 層架 4 層細部篩選按鈕列 (縮小版) -->
                <div id="shelfFilterContainer" class="mt-3 flex items-center gap-1.5 overflow-x-auto no-scrollbar hidden transition-all duration-300 pb-1">
                </div>
            </div>

            <!-- 藥品清單區域 -->
            <div class="flex-1 overflow-y-auto p-4 no-scrollbar bg-slate-50/50 dark:bg-slate-900/20 relative" id="medicineListContainer">
                <div id="medicineList" class="space-y-3 pb-20"></div>
                
                <div id="emptyState" class="hidden h-full flex-col items-center justify-center text-slate-400 space-y-4 opacity-70">
                    <i data-lucide="package-search" class="w-16 h-16 stroke-1"></i>
                    <p class="text-sm font-medium tracking-wide">找不到符合的藥品</p>
                </div>
            </div>

            <!-- 底部資訊與管理員按鈕 -->
            <div class="p-4 border-t border-slate-200/80 dark:border-slate-800 bg-white dark:bg-slate-900 flex justify-between items-center text-xs text-slate-500 font-medium">
                <div class="flex items-center gap-2">
                    <div class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></div>
                    共 <span id="totalItemsCount" class="text-slate-700 dark:text-slate-300 font-bold px-1">0</span> 筆項目
                </div>
                <div class="flex gap-2">
                    <button id="adminBtn" onclick="Controllers.openAddModal()" class="hidden bg-slate-800 dark:bg-slate-100 text-white dark:text-slate-900 px-3 py-1.5 rounded-md hover:bg-slate-700 dark:hover:bg-white transition-colors items-center gap-1.5 shadow-sm">
                        <i data-lucide="plus" class="w-3.5 h-3.5"></i> 新增
                    </button>
                    <!-- 外觀設定按鈕 -->
                    <button id="appearanceBtn" onclick="Controllers.openAppearanceModal()" class="hidden bg-indigo-100 dark:bg-indigo-900/30 text-indigo-700 dark:text-indigo-300 px-3 py-1.5 rounded-md hover:bg-indigo-200 dark:hover:bg-indigo-900/50 transition-colors items-center gap-1.5 shadow-sm">
                        <i data-lucide="palette" class="w-3.5 h-3.5"></i> 外觀
                    </button>
                </div>
            </div>
        </div>

        <!-- 右上方管理員浮動工具列 -->
        <div id="adminToolbar" class="interactive absolute top-4 right-4 bg-white/90 dark:bg-slate-800/90 backdrop-blur shadow-xl rounded-xl border border-slate-200 dark:border-slate-700 p-2 hidden flex-col gap-2 z-20">
            <div class="text-xs font-bold text-center text-slate-400 mb-1 border-b border-slate-200 dark:border-slate-700 pb-1">管理員工具</div>
            <button onclick="Controllers.openRackEditModal()" class="flex items-center gap-2 px-3 py-2 text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition-colors">
                <i data-lucide="layout-grid" class="w-4 h-4 text-primary"></i> 層架分類設定
            </button>
            <button onclick="Controllers.exportRackLabels()" class="flex items-center gap-2 px-3 py-2 text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition-colors">
                <i data-lucide="printer" class="w-4 h-4 text-emerald-500"></i> 列印層架標籤
            </button>
            <button onclick="Controllers.exportMedicineLabels()" class="flex items-center gap-2 px-3 py-2 text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition-colors">
                <i data-lucide="tags" class="w-4 h-4 text-amber-500"></i> 列印藥品標籤
            </button>
            <div class="h-px bg-slate-200 dark:bg-slate-700 my-1"></div>
            <!-- 新增：備份與匯入功能 -->
            <button onclick="Controllers.exportDataBackup()" class="flex items-center gap-2 px-3 py-2 text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition-colors">
                <i data-lucide="download" class="w-4 h-4 text-indigo-500"></i> 匯出資料備份 (JSON)
            </button>
            <label class="flex items-center gap-2 px-3 py-2 text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition-colors cursor-pointer">
                <i data-lucide="upload" class="w-4 h-4 text-rose-500"></i> 匯入資料還原
                <input type="file" id="importBackupInput" accept=".json" class="hidden" onchange="Controllers.importDataBackup(event)">
            </label>
        </div>

        <!-- 頂部提示列 (在畫布上方) -->
        <div class="absolute top-6 left-1/2 -translate-x-1/2 bg-white/90 dark:bg-slate-800/90 backdrop-blur-md px-6 py-3 rounded-full shadow-lg border border-slate-200/50 dark:border-slate-700/50 text-sm font-medium hidden md:flex items-center gap-3 z-10 transition-all duration-500 transform translate-y-[-20px] opacity-0" id="topHint">
            <i data-lucide="info" class="w-4 h-4 text-primary"></i>
            <span>搜尋左側藥品，系統將自動為您標示儲位。點擊俯視圖或 3D 模型中的層架可篩選顯示內容。</span>
        </div>
    </div>

    <!-- 右上角小地圖 -->
    <div id="minimap" title="空間俯視圖 - 點擊切換視角" class="hidden md:block">
        <div class="w-full h-full relative" id="minimapContainer">
            <div class="absolute top-2 left-1/2 -translate-x-1/2 text-[10px] font-black text-slate-400 tracking-widest bg-white/80 dark:bg-slate-800/80 px-2 py-0.5 rounded backdrop-blur-sm z-20 pointer-events-none">空間俯視圖</div>
            <!-- 層架與走道由 JS 動態產生 -->
        </div>
    </div>

    <!-- 右下角重置視角按鈕 -->
    <div class="interactive hidden md:flex" id="resetViewBtn" onclick="ThreeApp.resetCamera()" title="重置 3D 視角">
        <i data-lucide="focus" class="w-6 h-6"></i>
    </div>
    
    <!-- 縮小版手機底部導覽 (隱藏) -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white/90 dark:bg-slate-900/90 backdrop-blur-lg border-t border-slate-200 dark:border-slate-800 flex justify-around p-3 z-30 pb-safe hidden interactive">
        <button class="flex flex-col items-center gap-1 text-primary w-1/3" onclick="DOM.showMobilePanel('list')">
            <i data-lucide="list" class="w-5 h-5"></i>
            <span class="text-[10px] font-medium">清單</span>
        </button>
        <button class="flex flex-col items-center gap-1 text-slate-400 w-1/3 hover:text-slate-600 dark:hover:text-slate-200" onclick="DOM.showMobilePanel('map')">
            <i data-lucide="map" class="w-5 h-5"></i>
            <span class="text-[10px] font-medium">空間</span>
        </button>
        <button class="flex flex-col items-center gap-1 text-slate-400 w-1/3 hover:text-slate-600 dark:hover:text-slate-200" onclick="DOM.toggleAdmin()">
            <i data-lucide="settings" class="w-5 h-5"></i>
            <span class="text-[10px] font-medium">管理</span>
        </button>
    </nav>

    <!-- Modals 彈出視窗 -->

    <!-- 外觀設定 Modal -->
    <div id="appearanceModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden interactive flex items-center justify-center opacity-0 transition-opacity duration-300">
        <div class="bg-white dark:bg-slate-900 w-full max-w-md rounded-2xl shadow-2xl border border-slate-100 dark:border-slate-800 overflow-hidden transform scale-95 transition-transform duration-300" id="appearanceModalContent">
            <div class="px-6 py-4 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center bg-slate-50/50 dark:bg-slate-800/50">
                <h3 class="text-lg font-bold text-slate-800 dark:text-white flex items-center gap-2">
                    <i data-lucide="palette" class="w-5 h-5 text-indigo-500"></i> 視覺外觀設定
                </h3>
                <button onclick="Controllers.closeAppearanceModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="p-6 space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">地板顏色</label>
                    <select id="configFloorColor" class="w-full px-4 py-2 bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500/50 text-slate-800 dark:text-slate-100">
                        <option value="white">純淨白 (預設)</option>
                        <option value="gray">水泥灰</option>
                        <option value="wood">木紋暖色</option>
                        <option value="dark">深邃黑</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">走道風格</label>
                    <select id="configAisleColor" class="w-full px-4 py-2 bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500/50 text-slate-800 dark:text-slate-100">
                        <option value="gray">粉藍灰 (預設)</option>
                        <option value="blue">科技藍</option>
                        <option value="red">星光紅毯 (帶金邊)</option>
                        <option value="none">隱藏走道</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">搜尋結果發光色</label>
                        <input type="color" id="configSearchColor" value="#ac0606" class="w-full h-10 p-1 bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg cursor-pointer">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">選取層架發光色</label>
                        <input type="color" id="configSelectColor" value="#35a207" class="w-full h-10 p-1 bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg cursor-pointer">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">發光強度 (<span id="glowValDisplay">0.2</span>)</label>
                    <input type="range" id="configGlowIntensity" min="0" max="1" step="0.1" value="0.2" class="w-full accent-indigo-500" oninput="document.getElementById('glowValDisplay').textContent = this.value">
                </div>
            </div>
            <div class="px-6 py-4 bg-slate-50 dark:bg-slate-800/50 border-t border-slate-100 dark:border-slate-700 flex justify-end gap-3">
                <button onclick="Controllers.closeAppearanceModal()" class="px-4 py-2 text-sm font-medium text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-600 transition-all">取消</button>
                <button onclick="Controllers.saveAppearanceConfig()" class="px-4 py-2 text-sm font-medium text-white bg-indigo-500 rounded-lg hover:bg-indigo-600 transition-all shadow-md shadow-indigo-500/30">套用外觀</button>
            </div>
        </div>
    </div>

    <!-- 編輯藥品 Modal -->
    <div id="editModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden interactive flex items-center justify-center opacity-0 transition-opacity duration-300">
        <div class="bg-white dark:bg-slate-900 w-full max-w-md rounded-2xl shadow-2xl border border-slate-100 dark:border-slate-800 overflow-hidden transform scale-95 transition-transform duration-300" id="editModalContent">
            <div class="px-6 py-4 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center bg-slate-50/50 dark:bg-slate-800/50">
                <h3 class="text-lg font-bold text-slate-800 dark:text-white flex items-center gap-2" id="modalTitle">
                    <i data-lucide="edit-3" class="w-5 h-5 text-primary"></i> 編輯藥品資訊
                </h3>
                <button onclick="Controllers.closeEditModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">藥品內部代碼 (必填)</label>
                    <input type="text" id="editMedId" class="w-full px-4 py-2 bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 text-slate-800 dark:text-slate-100 transition-colors shadow-sm" placeholder="例如: 123456">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">英文藥名 (必填)</label>
                    <input type="text" id="editMedName" class="w-full px-4 py-2 bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 text-slate-800 dark:text-slate-100 transition-colors shadow-sm" placeholder="例如: Panadol">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">中文藥名 (選填)</label>
                    <input type="text" id="editMedChName" class="w-full px-4 py-2 bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 text-slate-800 dark:text-slate-100 transition-colors shadow-sm" placeholder="例如: 普拿疼">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">存放儲位 (格式: 鐵架-層數，如 1-1)</label>
                    <input type="text" id="editMedRack" class="w-full px-4 py-2 bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 text-slate-800 dark:text-slate-100 transition-colors shadow-sm" placeholder="例如: 1-1" list="rackOptions">
                    <datalist id="rackOptions">
                        <!-- 選項由 JS 動態產生 -->
                    </datalist>
                </div>
            </div>
            <div class="px-6 py-4 bg-slate-50 dark:bg-slate-800/50 border-t border-slate-100 dark:border-slate-700 flex justify-between items-center">
                <button onclick="Controllers.deleteMedicine()" id="deleteMedBtn" class="hidden px-4 py-2 text-sm font-medium text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-lg hover:bg-red-100 dark:hover:bg-red-900/40 transition-all duration-200 flex items-center gap-2">
                    <i data-lucide="trash-2" class="w-4 h-4"></i> 刪除
                </button>
                <div class="flex gap-3 ml-auto">
                    <button onclick="Controllers.closeEditModal()" class="px-4 py-2 text-sm font-medium text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-600 transition-all duration-200 hover:-translate-y-0.5">取消 (Esc)</button>
                    <button onclick="Controllers.saveEditForm()" id="saveMedBtn" class="px-4 py-2 text-sm font-medium text-white bg-primary rounded-lg hover:bg-primaryDark transition-all duration-200 hover:-translate-y-0.5 hover:shadow-lg hover:shadow-primary/30 flex items-center gap-2">
                        <i data-lucide="save" class="w-4 h-4 hidden" id="saveIcon"></i> 儲存
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 層架類別編輯 Modal -->
    <div id="rackEditModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden interactive flex items-center justify-center opacity-0 transition-opacity duration-300">
        <div class="bg-white dark:bg-slate-900 w-full max-w-lg rounded-2xl shadow-2xl border border-slate-100 dark:border-slate-800 overflow-hidden transform scale-95 transition-transform duration-300 max-h-[90vh] flex flex-col" id="rackEditModalContent">
            <div class="px-6 py-4 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center bg-slate-50/50 dark:bg-slate-800/50 shrink-0">
                <h3 class="text-lg font-bold text-slate-800 dark:text-white flex items-center gap-2">
                    <i data-lucide="layout-grid" class="w-5 h-5 text-primary"></i> 編輯層架類別
                </h3>
                <button onclick="Controllers.closeRackEditModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="p-6 overflow-y-auto" id="rackEditFormContainer">
                <!-- 動態產生表單 -->
            </div>
            <div class="px-6 py-4 bg-slate-50 dark:bg-slate-800/50 border-t border-slate-100 dark:border-slate-700 flex justify-end gap-3 shrink-0">
                <button onclick="Controllers.closeRackEditModal()" class="px-4 py-2 text-sm font-medium text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-600 transition-all duration-200">取消</button>
                <button onclick="Controllers.saveRackEditForm()" class="px-4 py-2 text-sm font-medium text-white bg-primary rounded-lg hover:bg-primaryDark transition-all duration-200 shadow-lg shadow-primary/30 flex items-center gap-2">
                    儲存變更
                </button>
            </div>
        </div>
    </div>

    <!-- Script 邏輯區 -->
    <script>
        // 外觀全域設定
        window.AppearanceConfig = {
            floorColor: 'white',
            aisleColor: 'gray',
            searchColor: '#ac0606', 
            selectColor: '#35a207', 
            glowIntensity: 0.2      
        };

        // 核心設定：鐵架空間與百分比對應
        let RACKS_CONFIG = [
            { no: 1, id: 'Rack-A', name: '鐵架 1', label: 'A區', theme: 'border-slate-800', category: '', top: '15%', left: '42%', width: '14%', height: '13%' },
            { no: 2, id: 'Rack-B', name: '鐵架 2', label: 'B區', theme: 'border-slate-800', category: '', top: '3.5%', left: '57%', width: '20%', height: '14%' },
            { no: 3, id: 'Rack-C', name: '鐵架 3', label: 'C區', theme: 'border-slate-800', category: '', top: '15%', left: '57%', width: '20%', height: '13%' },
            { no: 4, id: 'Rack-D', name: '鐵架 4', label: 'D區', theme: 'border-slate-800', category: '', top: '3.5%', left: '78%', width: '9%', height: '28%' },
            { no: 5, id: 'Rack-E', name: '鐵架 5', label: 'E區', theme: 'border-slate-800', category: '', top: '56%', left: '26%', width: '9%', height: '24%' },
            { no: 6, id: 'Rack-F', name: '鐵架 6', label: 'F區', theme: 'border-slate-800', category: '', top: '78%', left: '42%', width: '14%', height: '13%' }
        ];

        /**
         * 1. 狀態管理 (State)
         */
        const AppState = {
            // 請替換為您的 Apps Script 網址 (部署為網路應用程式)
            // 若為空字串，則採用 LocalStorage 模擬後端
            WEB_APP_URL: '', 
            
            medicines: [],
            searchQuery: '',
            selectedRackId: null,
            selectedShelf: null, // 1~4
            focusedRackId: null, // 被點擊選取的 Rack
            focusedShelf: null,  // 被點擊選取的層數
            lastUpdate: '',
            isAdmin: false,

            // 初始化：從 LocalStorage 載入，或嘗試 fetch
            async init() {
                this.loadRacksCategoryFromLocal();
                this.loadAppearanceFromLocal();
                
                const cached = localStorage.getItem('drugSysRealMedicines');
                if (cached) {
                    this.medicines = JSON.parse(cached);
                    this.lastUpdate = "快取資料 (載入中...)";
                }
                
                if (this.WEB_APP_URL) {
                    try {
                        await this.fetchSheet();
                    } catch (e) {
                        console.error('Fetch error:', e);
                        this.lastUpdate = "連線失敗，使用離線資料";
                    }
                } else {
                    if(!this.medicines.length) {
                        this.medicines = [
                            { id: '1001', name: 'Panadol 500mg', chName: '普拿疼', rackId: 'Rack-A', shelf: 1 },
                            { id: '1002', name: 'Amoxicillin 250mg', chName: '阿莫西林', rackId: 'Rack-B', shelf: 3 },
                            { id: '1003', name: 'Loratadine 10mg', chName: '樂敏', rackId: 'Rack-C', shelf: 4 },
                            { id: '1004', name: 'Ibuprofen 400mg', chName: '布洛芬', rackId: 'Rack-D', shelf: 2 },
                            { id: '1005', name: 'Metformin 500mg', chName: '庫魯化', rackId: 'Rack-E', shelf: 1 },
                            { id: '1006', name: 'Aspirin 100mg', chName: '阿斯匹靈', rackId: 'Rack-F', shelf: 4 }
                        ];
                        localStorage.setItem('drugSysRealMedicines', JSON.stringify(this.medicines));
                    }
                    this.lastUpdate = new Date().toLocaleString('zh-TW', { hour12: false }) + " (本地端)";
                }
            },

            async fetchSheet() {
                try {
                    const response = await fetch(this.WEB_APP_URL + '?action=getMedicines');
                    const data = await response.json();
                    
                    if (data && data.status === 'success') {
                        this.medicines = data.data.map(item => {
                            let rawRackId = String(item.rackId || 'Rack-A').trim();
                            let parsedRack = rawRackId;
                            let parsedShelf = 1;

                            // 處理 "1-1" 或 "Rack-A-2" 格式
                            if(rawRackId.includes('-') && !rawRackId.startsWith('Rack-')) {
                                const parts = rawRackId.split('-');
                                if(parts[0] === '1') parsedRack = 'Rack-A';
                                else if(parts[0] === '2') parsedRack = 'Rack-B';
                                else if(parts[0] === '3') parsedRack = 'Rack-C';
                                else if(parts[0] === '4') parsedRack = 'Rack-D';
                                else if(parts[0] === '5') parsedRack = 'Rack-E';
                                else if(parts[0] === '6') parsedRack = 'Rack-F';
                                parsedShelf = parseInt(parts[1]) || 1;
                            } else {
                                if (rawRackId === '1') parsedRack = 'Rack-A';
                                else if (rawRackId === '2') parsedRack = 'Rack-B';
                                else if (rawRackId === '3') parsedRack = 'Rack-C';
                                else if (rawRackId === '4') parsedRack = 'Rack-D';
                                else if (rawRackId === '5') parsedRack = 'Rack-E';
                                else if (rawRackId === '6') parsedRack = 'Rack-F';
                            }
                            
                            // 保證在 1~4 之間
                            parsedShelf = Math.max(1, Math.min(4, parsedShelf));

                            return {
                                id: String(item.id),
                                name: item.name,
                                chName: item.chName || '',
                                rackId: parsedRack,
                                shelf: parsedShelf
                            };
                        });
                        this.lastUpdate = new Date().toLocaleString('zh-TW', { hour12: false });
                        localStorage.setItem('drugSysRealMedicines', JSON.stringify(this.medicines));
                    }
                } catch (error) {
                    console.error('Fetch error:', error);
                    throw error;
                }
            },

            getFilteredMedicines() {
                let filtered = this.medicines;
                
                if (this.searchQuery) {
                    const q = this.searchQuery.toLowerCase();
                    filtered = filtered.filter(m => 
                        (m.id && m.id.toLowerCase().includes(q)) || 
                        m.name.toLowerCase().includes(q) || 
                        (m.chName && m.chName.toLowerCase().includes(q))
                    );
                } else if (this.focusedRackId) {
                    filtered = filtered.filter(m => m.rackId === this.focusedRackId && (!this.focusedShelf || m.shelf === this.focusedShelf));
                } else if (this.selectedRackId) {
                    filtered = filtered.filter(m => m.rackId === this.selectedRackId && (!this.selectedShelf || m.shelf === this.selectedShelf));
                }
                
                // 排序：先依據層架，再依據名稱
                return filtered.sort((a, b) => {
                    if (a.rackId !== b.rackId) return a.rackId.localeCompare(b.rackId);
                    if (a.shelf !== b.shelf) return a.shelf - b.shelf;
                    return a.name.localeCompare(b.name);
                });
            },

            // 取得搜尋結果對應的「層架與層數」組合
            getHighlightedLocations() {
                if (!this.searchQuery) return [];
                const q = this.searchQuery.toLowerCase();
                const matches = this.medicines.filter(m => 
                    (m.id && m.id.toLowerCase().includes(q)) || 
                    m.name.toLowerCase().includes(q) || 
                    (m.chName && m.chName.toLowerCase().includes(q))
                );
                
                // 回傳格式： [{ rackId: 'Rack-A', shelf: 1 }, ...]
                const locations = [];
                const seen = new Set();
                matches.forEach(m => {
                    const key = `${m.rackId}-${m.shelf}`;
                    if(!seen.has(key)) {
                        seen.add(key);
                        locations.push({ rackId: m.rackId, shelf: m.shelf });
                    }
                });
                return locations;
            },

            loadRacksCategoryFromLocal() {
                const saved = localStorage.getItem('drugSysRackCategories');
                if(saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        RACKS_CONFIG.forEach(r => {
                            if(parsed[r.id] !== undefined) r.category = parsed[r.id];
                        });
                    } catch(e) {}
                }
            },
            
            loadAppearanceFromLocal() {
                const saved = localStorage.getItem('drugSysAppearance');
                if(saved) {
                    try {
                        window.AppearanceConfig = { ...window.AppearanceConfig, ...JSON.parse(saved) };
                    } catch(e) {}
                }
            },

            // 寫入遠端 Google Sheet (或本地端)
            async saveToServer(id, name, rackId, chName, shelf) {
                // 將 Rack-A, Rack-B 轉回數字，並加上層數 (如 "1-1")
                let pureRackNum = '1';
                if(rackId === 'Rack-A') pureRackNum = '1';
                else if(rackId === 'Rack-B') pureRackNum = '2';
                else if(rackId === 'Rack-C') pureRackNum = '3';
                else if(rackId === 'Rack-D') pureRackNum = '4';
                else if(rackId === 'Rack-E') pureRackNum = '5';
                else if(rackId === 'Rack-F') pureRackNum = '6';

                const outputRackStr = `${pureRackNum}-${shelf}`;

                if (!this.WEB_APP_URL) {
                    this._updateLocalState(id, name, rackId, chName, shelf);
                    this.lastUpdate = new Date().toLocaleString('zh-TW', { hour12: false });
                    DOM.updateLastUpdateTime();
                    return true;
                }

                try {
                    const payload = {
                        action: 'updateMedicine',
                        data: { id: id, name: name, chName: chName, rackId: outputRackStr }
                    };
                    const response = await fetch(this.WEB_APP_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });
                    const result = await response.json();
                    
                    if (result.status === 'success') {
                        this._updateLocalState(id, name, rackId, chName, shelf);
                        this.lastUpdate = new Date().toLocaleString('zh-TW', { hour12: false });
                        DOM.updateLastUpdateTime();
                        return true;
                    } else {
                        alert("儲存失敗：" + result.message);
                        return false;
                    }
                } catch (error) {
                    alert("網路連線錯誤，無法同步至後端！將暫存於本地端。");
                    this._updateLocalState(id, name, rackId, chName, shelf);
                    this.lastUpdate = new Date().toLocaleString('zh-TW', { hour12: false }) + " (本地更新)";
                    DOM.updateLastUpdateTime();
                    return true;
                }
            },

            _updateLocalState(id, name, rackId, chName, shelf) {
                const existIndex = this.medicines.findIndex(m => m.id === id);
                if (existIndex >= 0) {
                    this.medicines[existIndex] = { id, name, rackId, chName, shelf };
                } else {
                    const newId = id || ('m' + Date.now()); 
                    this.medicines.push({ id: newId, name, rackId, chName, shelf }); 
                }
                localStorage.setItem('drugSysRealMedicines', JSON.stringify(this.medicines));
            },

            async deleteFromServer(id) {
                if (!this.WEB_APP_URL) {
                    this._deleteLocalState(id);
                    this.lastUpdate = new Date().toLocaleString('zh-TW', { hour12: false });
                    DOM.updateLastUpdateTime();
                    return true;
                }

                try {
                    const payload = { action: 'deleteMedicine', id: id };
                    const response = await fetch(this.WEB_APP_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });
                    const result = await response.json();
                    
                    if (result.status === 'success') {
                        this._deleteLocalState(id);
                        this.lastUpdate = new Date().toLocaleString('zh-TW', { hour12: false });
                        DOM.updateLastUpdateTime();
                        return true;
                    } else {
                        alert("刪除失敗：" + result.message);
                        return false;
                    }
                } catch (error) {
                    alert("網路連線錯誤，無法同步至後端！將暫時從本地端刪除。");
                    this._deleteLocalState(id);
                    this.lastUpdate = new Date().toLocaleString('zh-TW', { hour12: false }) + " (本地更新)";
                    DOM.updateLastUpdateTime();
                    return true;
                }
            },
            
            _deleteLocalState(id) {
                this.medicines = this.medicines.filter(m => m.id !== id);
                localStorage.setItem('drugSysRealMedicines', JSON.stringify(this.medicines));
            }
        };

        /**
         * 2. DOM 操作與渲染
         */
        const DOM = {
            searchInput: document.getElementById('searchInput'),
            clearSearchBtn: document.getElementById('clearSearchBtn'),
            medicineList: document.getElementById('medicineList'),
            emptyState: document.getElementById('emptyState'),
            totalItemsCount: document.getElementById('totalItemsCount'),
            statusDot: document.getElementById('statusDot'),
            statusText: document.getElementById('statusText'),
            adminToolbar: document.getElementById('adminToolbar'),
            adminBtn: document.getElementById('adminBtn'),
            appearanceBtn: document.getElementById('appearanceBtn'),
            
            editModal: document.getElementById('editModal'),
            editModalContent: document.getElementById('editModalContent'),
            editMedId: document.getElementById('editMedId'),
            editMedName: document.getElementById('editMedName'),
            editMedChName: document.getElementById('editMedChName'),
            editMedRack: document.getElementById('editMedRack'),
            modalTitle: document.getElementById('modalTitle'),
            
            shelfFilterContainer: document.getElementById('shelfFilterContainer'),

            renderList(items) {
                if (items.length === 0) {
                    this.medicineList.innerHTML = '';
                    this.emptyState.classList.remove('hidden');
                    this.emptyState.classList.add('flex');
                    return;
                }
                
                this.emptyState.classList.add('hidden');
                this.emptyState.classList.remove('flex');
                
                this.medicineList.innerHTML = items.map((med, index) => {
                    const rack = RACKS_CONFIG.find(r => r.id === med.rackId);
                    const rackName = rack ? rack.name : '未知';
                    const shelfStr = med.shelf ? `第${med.shelf}層` : '';
                    const delay = Math.min(index * 30, 300); // 錯開動畫時間
                    
                    return `
                        <div class="med-item bg-white dark:bg-slate-800 rounded-xl p-3 shadow-sm cursor-pointer relative overflow-hidden animate-fade-in group" 
                             style="animation-delay: ${delay}ms"
                             onclick="Controllers.handleMedicineClick('${med.rackId}', ${med.shelf})">
                            <div class="flex justify-between items-start">
                                <div class="flex-1">
                                    <div class="flex items-center gap-2 mb-1">
                                        <span class="text-xs font-mono bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400 px-1.5 py-0.5 rounded">${med.id}</span>
                                        <h3 class="font-bold text-slate-800 dark:text-slate-100 leading-tight">${med.name}</h3>
                                    </div>
                                    ${med.chName ? `<p class="text-xs text-slate-500 dark:text-slate-400 font-medium mb-2">${med.chName}</p>` : '<div class="h-1"></div>'}
                                </div>
                                
                                ${AppState.isAdmin ? `
                                    <button onclick="event.stopPropagation(); Controllers.openEditModal('${med.id}', '${med.name.replace(/'/g, "\\'")}', '${med.rackId}', '${(med.chName || '').replace(/'/g, "\\'")}', ${med.shelf || 1})" 
                                            class="p-1.5 text-slate-400 hover:text-primary hover:bg-primary/10 rounded-lg transition-colors shrink-0 opacity-0 group-hover:opacity-100 md:opacity-100">
                                        <i data-lucide="edit-2" class="w-4 h-4"></i>
                                    </button>
                                ` : ''}
                            </div>
                            
                            <div class="flex items-center mt-2">
                                <span class="text-[11px] font-bold px-2 py-1 bg-primary/10 text-primary dark:bg-primary/20 dark:text-primary/90 rounded-md border border-primary/20 flex items-center gap-1">
                                    <i data-lucide="map-pin" class="w-3 h-3"></i> ${rackName} ${shelfStr}
                                </span>
                            </div>
                        </div>
                    `;
                }).join('');
                lucide.createIcons();
            },

            renderRacks() {
                const minimapContainer = document.getElementById('minimapContainer');
                if (minimapContainer) {
                    minimapContainer.innerHTML = `
                        <!-- 空間俯視圖：走道背景色置中穿插 -->
                        <div class="absolute bg-[#abc2d8] dark:bg-slate-600 pointer-events-none" style="top: 36.5%; left: 2%; width: 96%; height: 11%;"></div>
                    ` + RACKS_CONFIG.map(rack => `
                        <div id="minimap-rack-${rack.id}" 
                             class="rack-minimap flex flex-col items-center justify-center cursor-pointer group"
                             style="top: ${rack.top}; left: ${rack.left}; width: ${rack.width}; height: ${rack.height};"
                             onclick="Controllers.handleRackClick('${rack.id}')"
                             title="${rack.name}${rack.category ? ` (${rack.category})` : ''}">
                            <span class="text-[9px] font-black text-slate-700 dark:text-slate-200 pointer-events-none group-hover:text-primary transition-colors">${rack.no}</span>
                        </div>
                    `).join('');
                }
                
                const dataList = document.getElementById('rackOptions');
                if(dataList) {
                    // 提供下拉選單：1-1 ~ 6-4
                    let options = '';
                    RACKS_CONFIG.forEach(rack => {
                        for(let i=1; i<=4; i++){
                            options += `<option value="${rack.no}-${i}">${rack.name} - 第${i}層</option>`;
                        }
                    });
                    dataList.innerHTML = options;
                }
            },

            updateRacksVisuals(highlightedLocations, selectedRackId, selectedShelf) {
                // 處理小地圖
                RACKS_CONFIG.forEach(rack => {
                    const el = document.getElementById(`minimap-rack-${rack.id}`);
                    if (!el) return;
                    
                    el.classList.remove('active', 'searched');
                    
                    if (selectedRackId === rack.id) {
                        el.classList.add('active');
                    } else {
                        // 若有任何一層符合搜尋，該鐵架就標紅
                        const isSearched = highlightedLocations.some(loc => loc.rackId === rack.id);
                        if (isSearched) el.classList.add('searched');
                    }
                });

                // 處理 3D 模型
                if (window.ThreeApp) {
                    ThreeApp.highlightRacks(highlightedLocations, selectedRackId, selectedShelf);
                }
            },

            updateStatusText() {
                if (AppState.searchQuery) {
                    this.statusText.innerHTML = `搜尋 <span class="font-bold text-primary">"${AppState.searchQuery}"</span>`;
                    this.statusDot.className = "w-2 h-2 rounded-full bg-primary inline-block animate-pulse";
                } else if (AppState.focusedRackId) {
                    const rack = RACKS_CONFIG.find(r => r.id === AppState.focusedRackId);
                    const rackName = rack ? rack.name : AppState.focusedRackId;

        /**
         * 3. 控制器 (Controllers)
         */
        const Controllers = {
            init() {
                this.setupEventListeners();
                DOM.renderRacks();
                
                AppState.init().then(() => {
                    this.refreshUI();
                    
                    // 隱藏載入畫面
                    setTimeout(() => {
                        const loader = document.getElementById('loader');
                        loader.style.opacity = '0';
                        setTimeout(() => loader.style.display = 'none', 500);
                        
                        // 顯示提示
                        setTimeout(() => {
                            const topHint = document.getElementById('topHint');
                            topHint.classList.remove('hidden');
                            setTimeout(() => {
                                topHint.classList.remove('opacity-0', 'translate-y-[-20px]');
                                // 5秒後自動隱藏
                                setTimeout(() => {
                                    topHint.classList.add('opacity-0', 'translate-y-[-20px]');
                                    setTimeout(() => topHint.classList.add('hidden'), 500);
                                }, 5000);
                            }, 50);
                        }, 1000);
                        
                    }, 800);
                });
            },

            setupEventListeners() {
                DOM.searchInput.addEventListener('input', (e) => {
                    AppState.searchQuery = e.target.value.trim();
                    if(AppState.searchQuery) {
                        DOM.clearSearchBtn.classList.remove('hidden');
                        AppState.focusedRackId = null; // 搜尋時取消篩選
                        AppState.focusedShelf = null;
                        AppState.selectedRackId = null;
                        AppState.selectedShelf = null;
                    } else {
                        DOM.clearSearchBtn.classList.add('hidden');
                    }
                    this.refreshUI();
                });
                
                // 鍵盤導航：Enter 收起鍵盤 (手機) 或執行某動作
                DOM.searchInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        DOM.searchInput.blur();
                    }
                });

                // 點擊空白處取消選取
                document.getElementById('canvas-container').addEventListener('mousedown', (e) => {
                    // 如果點擊的不是標籤
                    if(!e.target.closest('.rack-label-3d')) {
                       // 這裡可以做點擊背景的處理，目前保留 Three.js 預設控制
                    }
                });
            },

            clearSearch() {
                DOM.searchInput.value = '';
                AppState.searchQuery = '';
                DOM.clearSearchBtn.classList.add('hidden');
                DOM.searchInput.focus();
                this.refreshUI();
            },

            // 點擊左側清單項目 -> 鏡頭飛去該鐵架
            handleMedicineClick(rackId, shelf) {
                AppState.selectedRackId = rackId;
                AppState.selectedShelf = shelf || 1;
                // 注意：不要清空 searchQuery，讓清單保持現狀，只是視覺改變
                this.refreshUI();
                if(window.ThreeApp) {
                    ThreeApp.focusOnRack(rackId);
                }
            },

            // 點擊小地圖或 3D 標籤 -> 篩選清單
            handleRackClick(rackId) {
                if (AppState.focusedRackId === rackId && !AppState.focusedShelf) {
                    // 第二次點擊取消篩選
                    AppState.focusedRackId = null;
                    AppState.focusedShelf = null;
                } else {
                    AppState.focusedRackId = rackId;
                    AppState.focusedShelf = null; // 預設看整櫃
                    this.clearSearch(); // 點擊鐵架會清空搜尋
                }
                AppState.selectedRackId = null;
                AppState.selectedShelf = null;
                this.refreshUI();
                if(window.ThreeApp && AppState.focusedRackId) {
                    ThreeApp.focusOnRack(rackId);
                }
            },
            
            // 點擊 1-4 層數篩選
            handleShelfClick(shelf) {
                if(AppState.focusedShelf === shelf) {
                    AppState.focusedShelf = null; // 取消選取該層
                } else {
                    AppState.focusedShelf = shelf;
                }
                this.refreshUI();
            },

            refreshUI() {
                const filteredList = AppState.getFilteredMedicines();
                const highlightedLocations = AppState.getHighlightedLocations();
                
                DOM.renderList(filteredList);
                
                // 傳遞給 Three.js 的選取狀態
                // 如果有 focus (篩選模式)，亮 focus 的; 若無，則亮 select 的 (清單點擊模式)
                const activeRack = AppState.focusedRackId || AppState.selectedRackId;
                const activeShelf = AppState.focusedShelf || AppState.selectedShelf;
                
                DOM.updateRacksVisuals(highlightedLocations, activeRack, activeShelf);
                DOM.updateStatusText();
                if(DOM.totalItemsCount) DOM.totalItemsCount.textContent = AppState.medicines.length; 
                
                // 動態渲染層數篩選按鈕 (縮小版)
                if (AppState.focusedRackId) {
                    const rack = RACKS_CONFIG.find(r => r.id === AppState.focusedRackId);
                    const rackName = rack ? rack.name : AppState.focusedRackId;
                    let html = '';
                    // 新增整櫃按鈕
                    const isAll = AppState.focusedShelf === null;
                    const allClass = isAll ? 'bg-primary text-white shadow-sm' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 border border-slate-200 dark:border-slate-600';
                    html += `<button onclick="Controllers.handleShelfClick(null)" class="shrink-0 px-3 py-1 text-xs font-medium rounded-full transition-colors ${allClass}">整櫃</button>`;

                    for(let i=1; i<=4; i++) {
                        const isActive = AppState.focusedShelf === i;
                        const bgClass = isActive ? 'bg-primary text-white shadow-sm' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 border border-slate-200 dark:border-slate-600';
                        html += `<button onclick="Controllers.handleShelfClick(${i})" class="shrink-0 px-3 py-1 text-xs font-medium rounded-full transition-colors ${bgClass}">${rackName}-${i}</button>`;
                    }
                    DOM.shelfFilterContainer.innerHTML = html;
                    DOM.shelfFilterContainer.classList.remove('hidden');
                } else {
                    DOM.shelfFilterContainer.classList.add('hidden');
                }
            },

            toggleTheme() {
                const html = document.documentElement;
                if (html.classList.contains('dark')) {
                    html.classList.remove('dark');
                    document.getElementById('themeIcon').setAttribute('data-lucide', 'moon');
                } else {
                    html.classList.add('dark');
                    document.getElementById('themeIcon').setAttribute('data-lucide', 'sun');
                }
                lucide.createIcons();
                if(window.ThreeApp) {
                    ThreeApp.updateTheme();
                }
            },
            
            // 藥品編輯
            openAddModal() {
                this.openEditModal('', '', 'Rack-A', '', 1);
            },

            openEditModal(id, name, rackId, chName = '', shelf = 1) {
                DOM.editMedId.value = id || '';
                DOM.editMedName.value = name || '';
                if(DOM.editMedChName) DOM.editMedChName.value = chName || '';
                
                // 將下拉選單選至對應的 "1-1" 格式
                let pureRackNum = '1';
                if(rackId === 'Rack-A') pureRackNum = '1';
                else if(rackId === 'Rack-B') pureRackNum = '2';
                else if(rackId === 'Rack-C') pureRackNum = '3';
                else if(rackId === 'Rack-D') pureRackNum = '4';
                else if(rackId === 'Rack-E') pureRackNum = '5';
                else if(rackId === 'Rack-F') pureRackNum = '6';
                
                DOM.editMedRack.value = `${pureRackNum}-${shelf}`;

                DOM.modalTitle.innerHTML = id ? '<i data-lucide="edit-3" class="w-5 h-5 text-primary"></i> 編輯藥品資訊' : '<i data-lucide="plus-circle" class="w-5 h-5 text-emerald-500"></i> 新增藥品';
                
                // 動態判斷是否顯示刪除按鈕
                const deleteBtn = document.getElementById('deleteMedBtn');
                if (deleteBtn) {
                    if (id) {
                        deleteBtn.classList.remove('hidden');

                        deleteBtn.classList.add('hidden');
                    }
                }

                DOM.editModal.classList.remove('hidden');
                lucide.createIcons();

                    DOM.editModal.classList.remove('opacity-0');
                    DOM.editModalContent.classList.remove('scale-95');
                }, 10);

            closeEditModal() {
                DOM.editModal.classList.add('opacity-0');
                DOM.editModalContent.classList.add('scale-95');
                setTimeout(() => DOM.editModal.classList.add('hidden'), 300);
            },

            async saveEditForm() {
                const id = DOM.editMedId.value.trim();
                const name = DOM.editMedName.value.trim();
                const chName = DOM.editMedChName ? DOM.editMedChName.value.trim() : '';
                const rackInput = DOM.editMedRack.value.trim(); // e.g. "1-1"
                
                if (!id || !name) {
                    alert('請填寫內部代碼與英文藥名！');
                    return;
                }
                
                // 解析 rackInput 回 rackId 與 shelf
                let parsedRack = 'Rack-A';
                let parsedShelf = 1;
                if(rackInput.includes('-')) {
                    const parts = rackInput.split('-');
                    if(parts[0] === '1') parsedRack = 'Rack-A';
                    else if(parts[0] === '2') parsedRack = 'Rack-B';
                    else if(parts[0] === '3') parsedRack = 'Rack-C';
                    else if(parts[0] === '4') parsedRack = 'Rack-D';
                    else if(parts[0] === '5') parsedRack = 'Rack-E';
                    else if(parts[0] === '6') parsedRack = 'Rack-F';
                    parsedShelf = parseInt(parts[1]) || 1;
                } else {
                    if(rackInput === '1') parsedRack = 'Rack-A';
                    else if(rackInput === '2') parsedRack = 'Rack-B';
                    else if(rackInput === '3') parsedRack = 'Rack-C';
                    else if(rackInput === '4') parsedRack = 'Rack-D';
                    else if(rackInput === '5') parsedRack = 'Rack-E';
                    else if(rackInput === '6') parsedRack = 'Rack-F';
                }
                parsedShelf = Math.max(1, Math.min(4, parsedShelf));

                const btn = document.getElementById('saveMedBtn');
                const icon = document.getElementById('saveIcon');
                btn.disabled = true;
                icon.classList.remove('hidden');
                icon.setAttribute('data-lucide', 'loader-2');
                icon.classList.add('animate-spin');
                lucide.createIcons();

                const success = await AppState.saveToServer(id, name, parsedRack, chName, parsedShelf);
                
                btn.disabled = false;
                icon.classList.remove('animate-spin');
                icon.classList.add('hidden');
                
                if (success) {
                    this.closeEditModal();
                    this.refreshUI();  
                }
            },

            async deleteMedicine() {
                const id = DOM.editMedId.value.trim();
                if (!id) return;
                
                if (confirm('警告：確定要刪除此藥品嗎？此操作無法復原！')) {
                    const deleteBtn = document.getElementById('deleteMedBtn');
                    const originalText = deleteBtn.innerHTML;
                    deleteBtn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> 刪除中...';
                    deleteBtn.disabled = true;
                    lucide.createIcons();

                    const success = await AppState.deleteFromServer(id);
                    
                    deleteBtn.innerHTML = originalText;
                    deleteBtn.disabled = false;
                    lucide.createIcons();

                    if (success) {
                        this.closeEditModal();
                        this.refreshUI();  
                    }
                }
            },

            exportDataBackup() {
                const data = {
                    timestamp: new Date().toISOString(),
                    medicines: AppState.medicines,
                    rackCategories: RACKS_CONFIG.map(r => ({id: r.id, category: r.category}))
                };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `藥品庫存備份_${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            },

            importDataBackup(event) {
                const file = event.target.files[0];
                if(!file) return;

                if(!confirm('警告：匯入備份將會覆蓋您目前的本地資料，請確認是否繼續？')) {
                    event.target.value = ''; 
                    return;
                }

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        if(data.medicines && Array.isArray(data.medicines)) {
                            AppState.medicines = data.medicines;
                            localStorage.setItem('drugSysRealMedicines', JSON.stringify(data.medicines));
                        }
                        if(data.rackCategories && Array.isArray(data.rackCategories)) {
                            const catMap = {};
                            data.rackCategories.forEach(rc => catMap[rc.id] = rc.category);
                            localStorage.setItem('drugSysRackCategories', JSON.stringify(catMap));
                            AppState.loadRacksCategoryFromLocal();
                        }
                        alert('備份匯入成功！系統將重新整理。');
                        location.reload();
                    } catch(err) {
                        alert('檔案格式錯誤，無法匯入！');
                    }
                };
                reader.readAsText(file);
                event.target.value = '';
            },
