<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>藥品庫存區地圖</title>
    
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- 引入 Google Fonts: Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- 引入 Three.js 及其控制模組 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <!-- 自訂 Tailwind 設定與 CSS 動畫 -->
    <script>
        tailwind.config = {
            darkMode: 'class', 
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                    },
                    colors: {
                        primary: '#0ea5e9', 
                        primaryDark: '#0284c7',
                    }
                }
            }
        }
    </script>
    
    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .rack-highlighted {
            z-index: 20;
            background-color: #f0f9ff;
        }

        .rack-selected {
            border-color: #10b981 !important; 
            background-color: #ecfdf5 !important;
            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.4) !important;
            transform: translateY(-8px);
            z-index: 15;
        }
        
        .dark .rack-selected {
            background-color: rgba(16, 185, 129, 0.1) !important;
            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.2) !important;
        }
        
        .rack-base {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 h-screen w-full overflow-hidden flex flex-col text-slate-800 dark:text-slate-100 transition-colors duration-300">

    <header class="h-16 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 shadow-sm flex items-center px-6 shrink-0 z-30 relative transition-colors duration-300">
        <div class="flex items-center gap-3 text-primary">
            <i data-lucide="cross" class="w-6 h-6"></i>
            <h1 class="text-xl font-bold tracking-wide">藥品庫存區地圖</h1>
        </div>
        <div class="ml-auto flex items-center gap-4">
            <div class="hidden sm:flex items-center gap-2 text-sm text-slate-500 dark:text-slate-400">
                <i data-lucide="clock" class="w-4 h-4"></i>
                <span id="lastUpdateTime">最後更新: 載入中...</span>
            </div>
            
            <button onclick="Controllers.toggleAuth()" class="flex items-center gap-1.5 px-3 py-1.5 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-600 dark:text-slate-300 rounded-lg transition-all duration-200 hover:-translate-y-0.5 shadow-sm border border-transparent dark:border-slate-600" title="管理員登入">
                <i data-lucide="log-in" id="authIcon" class="w-4 h-4"></i>
                <span class="text-sm font-medium hidden md:block" id="authText">登入</span>
            </button>

            <button onclick="Controllers.openSettingsModal()" class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition-all duration-300 hover:rotate-90 shadow-sm bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600" title="系統設定">
                <i data-lucide="settings" class="w-4 h-4"></i>
            </button>

            <button onclick="Controllers.toggleDarkMode()" class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition-all duration-200 hover:-translate-y-0.5 shadow-sm bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600" title="切換深淺色模式">
                <i data-lucide="moon" class="w-4 h-4 hidden dark:block"></i>
                <i data-lucide="sun" class="w-4 h-4 block dark:hidden"></i>
            </button>
        </div>
    </header>

    <main class="flex-1 flex flex-col md:flex-row overflow-hidden relative pb-[70px] md:pb-0">
        
        <aside class="w-full md:w-[400px] bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 flex flex-col shrink-0 z-20 shadow-[4px_0_24px_rgba(0,0,0,0.02)] h-[40vh] md:h-auto transition-colors duration-300">
            
            <div class="p-4 md:p-6 border-b border-slate-100 dark:border-slate-700 bg-white dark:bg-slate-800 sticky top-0 shrink-0 transition-colors duration-300">
                <div class="hidden md:flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-slate-800 dark:text-slate-100">尋找藥品</h2>
                    <div class="hidden md:flex items-center gap-2">
                        <button onclick="Controllers.resetAll()" class="flex items-center gap-1 text-xs bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 px-3 py-1.5 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-600 transition-all duration-200 hover:-translate-y-0.5 shadow-sm border border-slate-200 dark:border-slate-600" title="清除搜尋與選取狀態">
                            <i data-lucide="eraser" class="w-3.5 h-3.5"></i> 清除
                        </button>
                        <button onclick="Controllers.openEditModal('', '', 'Rack-A', 1)" class="auth-required hidden flex items-center gap-1 text-xs bg-primary text-white px-3 py-1.5 rounded-lg hover:bg-primaryDark transition-all duration-200 hover:-translate-y-0.5 shadow-sm hover:shadow-primary/30">
                            <i data-lucide="plus" class="w-3.5 h-3.5"></i> 新增
                        </button>
                    </div>
                </div>
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i data-lucide="search" class="w-5 h-5 text-slate-400 group-focus-within:text-primary transition-colors"></i>
                    </div>
                    <input type="text" id="searchInput" 
                        class="w-full pl-10 pr-10 py-3 bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl text-slate-700 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all duration-300 hover:shadow-sm"
                        placeholder="請輸入英文或中文藥品名稱">
                    <div id="searchLoader" class="absolute inset-y-0 right-0 pr-3 flex items-center hidden pointer-events-none">
                        <i data-lucide="loader-2" class="w-5 h-5 text-primary animate-spin"></i>
                    </div>
                    <button id="clearSearchBtn" class="absolute inset-y-0 right-0 pr-3 flex items-center hidden text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors">
                        <i data-lucide="x-circle" class="w-5 h-5"></i>
                    </button>
                </div>
                
                <div id="statusMessage" class="mt-4 text-sm text-slate-500 dark:text-slate-400 hidden md:flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-slate-300 dark:bg-slate-600 inline-block" id="statusDot"></span>
                    <span id="statusText">顯示所有藥品清單</span>
                </div>

                <!-- 層架 4 層細部篩選按鈕列 -->
                <div id="shelfFilterContainer" class="mt-3 flex items-center gap-2 overflow-x-auto no-scrollbar hidden transition-all duration-300 pb-1">
                </div>
            </div>

            <div class="flex-1 overflow-y-auto p-4 no-scrollbar bg-slate-50/50 dark:bg-slate-900/20 relative" id="medicineListContainer">
            </div>
            
            <div class="hidden md:block p-4 border-t border-slate-100 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs text-center text-slate-400 dark:text-slate-500 shrink-0 transition-colors duration-300">
                系統中共有 <span id="totalItemsCount" class="font-bold text-slate-600 dark:text-slate-300">0</span> 項藥品
            </div>
        </aside>

        <section class="flex-1 bg-slate-100/50 dark:bg-slate-900/50 relative overflow-hidden flex flex-col transition-colors duration-300">
            
            <div class="p-6 pb-0 shrink-0 flex justify-between items-start z-10 relative pointer-events-none">
                <div class="pr-4 pointer-events-auto">
                    <p class="hidden md:block text-slate-500 dark:text-slate-400 text-sm mb-3">搜尋左側藥品，系統將自動為您標示儲位。點擊俯視圖或 3D 模型中的層架可篩選顯示內容。</p>
                    <div id="rackInfoContainer" class="flex flex-wrap gap-2">
                    </div>
                </div>
                
                <!-- 空間俯視圖 -->
                <div class="hidden sm:flex flex-col items-center gap-1 shrink-0 pointer-events-auto z-20">
                    <span class="text-[10px] font-bold text-slate-400 dark:text-slate-500 tracking-widest bg-white/80 dark:bg-slate-800/80 px-2 rounded backdrop-blur-sm shadow-sm border border-slate-200 dark:border-slate-700">空間俯視圖</span>
                    <!-- 修改 1：配合地板與 F 外推，將容器高度由 100px 加大至 140px -->
                    <div class="relative w-40 h-[140px] border-[2px] border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 rounded-sm shadow-md p-1 transition-colors duration-300" id="minimapContainer">
                    </div>
                </div>
            </div>

            <div class="absolute inset-0 z-0 overflow-hidden outline-none cursor-grab active:cursor-grabbing" id="canvas-container">
            </div>

            <button onclick="ThreeApp.resetCamera()" class="absolute bottom-6 right-6 p-3 bg-white/90 dark:bg-slate-800/90 rounded-full shadow-lg border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:text-primary dark:hover:text-primary transition-all duration-300 hover:scale-110 z-20 focus:outline-none" title="重置 3D 視角">
                <i data-lucide="focus" class="w-6 h-6"></i>
            </button>

            <div id="tooltip3d" class="fixed hidden bg-slate-900/95 text-white p-3 rounded-lg shadow-2xl z-50 pointer-events-none transform -translate-x-1/2 -translate-y-[calc(100%+15px)] backdrop-blur-sm border border-slate-700 whitespace-nowrap transition-opacity duration-200">
            </div>
        </section>
    </main>

    <nav class="md:hidden fixed bottom-0 w-full bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 flex justify-around p-2 z-40 transition-colors duration-300 shadow-[0_-4px_20px_rgba(0,0,0,0.05)] pb-safe">
        <button onclick="document.getElementById('searchInput').focus()" class="flex flex-col items-center gap-1 p-2 text-slate-500 dark:text-slate-400 hover:text-primary dark:hover:text-primary transition-all duration-200 hover:-translate-y-1">
            <i data-lucide="search" class="w-5 h-5"></i>
            <span class="text-[10px] font-medium">搜尋</span>
        </button>
        <button onclick="Controllers.openEditModal('', '', 'Rack-A', 1)" class="auth-required hidden flex flex-col items-center gap-1 p-2 text-primary hover:text-primaryDark transition-all duration-200 hover:-translate-y-1">
            <div class="bg-primary/10 p-1.5 rounded-full">
                <i data-lucide="plus" class="w-5 h-5"></i>
            </div>
            <span class="text-[10px] font-medium">新增</span>
        </button>
        <button onclick="Controllers.resetAll()" class="flex flex-col items-center gap-1 p-2 text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 transition-all duration-200 hover:-translate-y-1">
            <i data-lucide="refresh-cw" class="w-5 h-5"></i>
            <span class="text-[10px] font-medium">重置</span>
        </button>
    </nav>

    <div id="printFilterModal" class="fixed inset-0 bg-slate-900/60 dark:bg-slate-950/80 z-[70] hidden flex items-center justify-center backdrop-blur-sm opacity-0 transition-opacity duration-300">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl w-full max-w-sm mx-4 overflow-hidden transform scale-95 transition-all duration-300" id="printFilterModalContent">
            <div class="px-6 py-4 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-800/50">
                <h3 class="font-bold text-slate-800 dark:text-slate-100 text-lg" id="printModalTitle">自訂列印篩選</h3>
                <button onclick="Controllers.closePrintFilterModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-transform duration-200 hover:rotate-90">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="p-6 flex flex-col gap-4">
                <input type="hidden" id="printModeInput">
                
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">請選擇要匯出的層架範圍：</label>
                    <div class="grid grid-cols-2 gap-2" id="printRacksContainer">
                    </div>
                </div>

                <div class="mt-2 border-t border-slate-100 dark:border-slate-700 pt-4">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="printApplySearch" class="w-4 h-4 text-primary bg-slate-100 border-slate-300 rounded focus:ring-primary dark:bg-slate-700 dark:border-slate-600">
                        <span class="text-sm text-slate-700 dark:text-slate-300">套用當前搜尋條件篩選</span>
                    </label>
                    <p class="text-xs text-slate-500 mt-1 pl-6" id="printSearchTextHint">目前無搜尋條件</p>
                </div>
                
                <div class="mt-2 hidden" id="printCodeOptionContainer">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="printIncludeCode" class="w-4 h-4 text-primary bg-slate-100 border-slate-300 rounded focus:ring-primary dark:bg-slate-700 dark:border-slate-600" checked>
                        <span class="text-sm text-slate-700 dark:text-slate-300">列印時包含「內部代碼」欄位</span>
                    </label>
                </div>
            </div>
            <div class="px-6 py-4 bg-slate-50 dark:bg-slate-800/50 border-t border-slate-100 dark:border-slate-700 flex justify-end gap-3">
                <button onclick="Controllers.closePrintFilterModal()" class="px-4 py-2 text-sm font-medium text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-600 transition-all duration-200 hover:-translate-y-0.5">取消 (Esc)</button>
                <button onclick="Controllers.confirmPrint()" class="px-4 py-2 text-sm font-medium text-white bg-primary rounded-lg hover:bg-primaryDark transition-all duration-200 hover:-translate-y-0.5 shadow-sm flex items-center gap-2">
                    <i data-lucide="printer" class="w-4 h-4"></i> 確認列印
                </button>
            </div>
        </div>
    </div>

    <!-- 編輯 Modal (支援層數) -->
    <div id="editModal" class="fixed inset-0 bg-slate-900/60 dark:bg-slate-950/80 z-50 hidden flex items-center justify-center backdrop-blur-sm opacity-0 transition-opacity duration-300">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl w-full max-w-md mx-4 overflow-hidden transform scale-95 transition-all duration-300" id="editModalContent">
            <div class="px-6 py-4 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-800/50">
                <h3 class="font-bold text-slate-800 dark:text-slate-100 text-lg" id="modalTitle">新增/編輯藥品</h3>
                <button onclick="Controllers.closeEditModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-transform duration-200 hover:rotate-90">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="p-6 flex flex-col gap-4">
                <input type="hidden" id="editMedOriginalId">
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">藥品代碼 (內部代碼)</label>
                    <input type="text" id="editMedId" class="w-full px-4 py-2 bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 text-slate-800 dark:text-slate-100 transition-colors shadow-sm" placeholder="請輸入藥品代碼">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">藥品名稱</label>
                    <input type="text" id="editMedName" class="w-full px-4 py-2 bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 text-slate-800 dark:text-slate-100 transition-colors shadow-sm" placeholder="請輸入藥品名稱">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">中文商品名稱 (列印標籤用)</label>
                    <input type="text" id="editMedChName" class="w-full px-4 py-2 bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 text-slate-800 dark:text-slate-100 transition-colors shadow-sm" placeholder="請輸入中文商品名稱 (選填)">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">存放儲位 (與層數)</label>
                    <div class="flex gap-2">
                        <select id="editMedRack" class="w-2/3 px-4 py-2 bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 text-slate-800 dark:text-slate-100 transition-colors shadow-sm">
                        </select>
                        <select id="editMedShelf" class="w-1/3 px-3 py-2 bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 text-slate-800 dark:text-slate-100 transition-colors shadow-sm">
                            <option value="1">第 1 層</option>
                            <option value="2">第 2 層</option>
                            <option value="3">第 3 層</option>
                            <option value="4">第 4 層</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="px-6 py-4 bg-slate-50 dark:bg-slate-800/50 border-t border-slate-100 dark:border-slate-700 flex justify-between items-center">
                <button onclick="Controllers.deleteMedicine()" id="deleteMedBtn" class="hidden px-4 py-2 text-sm font-medium text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-lg hover:bg-red-100 dark:hover:bg-red-900/40 transition-all duration-200 flex items-center gap-2">
                    <i data-lucide="trash-2" class="w-4 h-4"></i> 刪除
                </button>
                <div class="flex gap-3 ml-auto">
                    <button onclick="Controllers.closeEditModal()" class="px-4 py-2 text-sm font-medium text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-600 transition-all duration-200 hover:-translate-y-0.5">取消 (Esc)</button>
                    <button onclick="Controllers.saveEditForm()" id="saveMedBtn" class="px-4 py-2 text-sm font-medium text-white bg-primary rounded-lg hover:bg-primaryDark transition-all duration-200 hover:-translate-y-0.5 hover:shadow-lg hover:shadow-primary/30 flex items-center gap-2">
                        <i data-lucide="save" class="w-4 h-4 hidden" id="saveIcon"></i> 儲存
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 層架類別編輯 Modal -->
    <div id="rackEditModal" class="fixed inset-0 bg-slate-900/60 dark:bg-slate-950/80 z-50 hidden flex items-center justify-center backdrop-blur-sm opacity-0 transition-opacity duration-300">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl w-full max-w-md mx-4 overflow-hidden transform scale-95 transition-all duration-300" id="rackEditModalContent">
            <div class="px-6 py-4 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-800/50">
                <h3 class="font-bold text-slate-800 dark:text-slate-100 text-lg">編輯層架</h3>
                <button onclick="Controllers.closeRackEditModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-transform duration-200 hover:rotate-90">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="p-6 flex flex-col gap-3 max-h-[60vh] overflow-y-auto no-scrollbar" id="rackEditListContainer">
            </div>
            <div class="px-6 py-4 bg-slate-50 dark:bg-slate-800/50 border-t border-slate-100 dark:border-slate-700 flex justify-end gap-3">
                <button onclick="Controllers.closeRackEditModal()" class="px-4 py-2 text-sm font-medium text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-600 transition-all duration-200 hover:-translate-y-0.5">取消 (Esc)</button>
                <button id="saveRackBtn" onclick="Controllers.saveRackEditForm()" class="px-4 py-2 text-sm font-medium text-white bg-primary rounded-lg hover:bg-primaryDark transition-all duration-200 hover:-translate-y-0.5 hover:shadow-lg hover:shadow-primary/30 flex items-center gap-2">
                    <i data-lucide="save" class="w-4 h-4"></i> 儲存變更
                </button>
            </div>
        </div>
    </div>

    <!-- 系統設定 Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-slate-900/60 dark:bg-slate-950/80 z-50 hidden flex items-center justify-center backdrop-blur-sm opacity-0 transition-opacity duration-300">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl w-full max-w-2xl mx-4 overflow-hidden transform scale-95 transition-all duration-300" id="settingsModalContent">
            <div class="px-6 py-4 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-800/50">
                <h3 class="font-bold text-slate-800 dark:text-slate-100 text-lg">系統設定</h3>
                <button onclick="Controllers.closeSettingsModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-transform duration-200 hover:rotate-90">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-4 max-h-[70vh] overflow-y-auto no-scrollbar">

    <!-- JavaScript 應用程式邏輯區塊 -->
    <script>
        /**
         * 1. 資料架構與狀態
         */
         
        window.AppearanceConfig = {
            floorColor: 'white',
            objectColor: 'plain',
            searchColor: '#ac0606', 
            selectColor: '#35a207', 
            glowIntensity: 0.2      
        };

        // 修正：微調上半部鐵架 (A~E) 的 top 數值，將它們整體向上移動 3%，
        // 確保它們與走道之間有足夠且相等的間距，不再壓在走道上。
        // 3D 地圖與空間俯視圖共用的走道座標，避免兩邊手動調整後產生偏移。
        const AISLE_Z = 0.5;
        const AISLE_DEPTH = 3.2;
        const MAP_ROOM_SIZE = 30;

        let RACKS_CONFIG = [
             { no: 1, id: 'Rack-A', name: '鐵架 1', label: 'A區', theme: 'border-slate-800', category: '', top: '82%', left: '27%', width: '14%', height: '13%' },
            { no: 2, id: 'Rack-B', name: '鐵架 2', label: 'B區', theme: 'border-slate-800', category: '', top: '60%', left: '14%', width: '9%', height: '16%' },
            { no: 3, id: 'Rack-C', name: '鐵架 3', label: 'C區', theme: 'border-slate-800', category: '', top: '30%', left: '27%', width: '14%', height: '13%' },
            { no: 4, id: 'Rack-D', name: '鐵架 4', label: 'D區', theme: 'border-slate-800', category: '', top: '30%', left: '42%', width: '20%', height: '13%' },
            { no: 5, id: 'Rack-E', name: '鐵架 5', label: 'E區', theme: 'border-slate-800', category: '', top: '15%', left: '63%', width: '9%', height: '28%' },
            { no: 6, id: 'Rack-F', name: '鐵架 6', label: 'F區', theme: 'border-slate-800', category: '', top: '15%', left: '42%', width: '20%', height: '14%' },
            { no: 7, id: 'Rack-G', name: '桌面櫃 G', label: 'G區', theme: 'border-slate-800', category: '', top: '1%', left: '90%', width: '11%', height: '30%' },
            { no: 8, id: 'Rack-H', name: '桌面櫃 H', label: 'H區', theme: 'border-slate-800', category: '', top: '31%', left: '90%', width: '11%', height: '30%' },
            { no: 9, id: 'Rack-I', name: '堆置處 I', label: 'I區', theme: 'border-slate-800', category: '', top: '1%', left: '28%', width: '12%', height: '12%' }
        ];

        const AppState = {
            medicines: [],
            searchQuery: '',
            selectedRackId: null, 
            selectedShelf: null, // 記錄選取的層數 (1-4)
            focusedRackId: null, 
            focusedShelf: null,  // 記錄聚焦的層數 (1-4)
            keyboardSelectedIndex: -1, 
            lastUpdate: null, 
            isLoggedIn: false, 
            
            SHEET_ID: '1NSoY899Pk9KDaXJwhPxwka3YSsd_2Wt0DKffEU0tXkA', 
            WEB_APP_URL: 'https://script.google.com/macros/s/AKfycbzSdtEPXrU_tbM8aGsfO4V254solwNr9KlOY6rfSVZOUV5qmj8HWcVc4ccOui9uB6eN/exec',
            
            async initData() {
                if(!this.SHEET_ID) {
                    this.medicines = [];
                    this.lastUpdate = new Date().toLocaleString('zh-TW', { hour12: false }) + " (未設定資料庫)";
                    DOM.updateLastUpdateTime();
                    return;
                }

                const fetchSheet = async (sheetName = '') => {
                    let url = `https://docs.google.com/spreadsheets/d/${this.SHEET_ID}/gviz/tq?tqx=out:json`;
                    if (sheetName) url += `&sheet=${encodeURIComponent(sheetName)}`;
                    
                    const res = await fetch(url);
                    if (!res.ok) throw new Error('Network response was not ok');
                    const text = await res.text();
                    const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S\w]+)\);/);
                    if (!match) throw new Error('Invalid response format');
                    const data = JSON.parse(match[1]);
                    if (data.status === 'error') {
                        throw new Error(data.errors?.[0]?.message || 'Google Sheet 讀取錯誤');
                    }
                    return data;
                };

                try {
                    try {
                        const rackJson = await fetchSheet('Racks');
                        const backendRacks = rackJson.table.rows.map(row => ({
                            id: row.c[0]?.v || '',
                            name: row.c[1]?.v || '',
                            category: row.c[2]?.v || ''
                        }));
                        backendRacks.forEach(br => {
                            const r = RACKS_CONFIG.find(x => x.id === br.id);
                            if (r) {
                                if (br.name) r.name = br.name;
                                if (br.category) r.category = br.category;
                            }
                        });
                    } catch(e) {}
                    DOM.renderRackOptions(); 

                    const medJson = await fetchSheet();
                    
                    this.medicines = medJson.table.rows.map(row => {
                        // 優先讀取格式化後的值 (f)，避免 1-2 變成 Date 格式
                        let rawStr = (row.c[2]?.f || row.c[2]?.v || '').toString().trim();
                        
                        // 清除可能因為強制純文字而加入的開頭單引號
                        if (rawStr.startsWith("'")) rawStr = rawStr.substring(1);
                        
                        // 儲位資料可能來自舊格式 7-2，也可能來自新版 Rack-G-2。
                        // 兩種格式都統一保留為可正確辨識的內部 Rack ID。
                        rawStr = rawStr.trim();
                        rawStr = rawStr.replace(/\//g, '-');
                        rawStr = rawStr.replace(/^Rack-G\s*[-:]\s*(\d+)$/i, 'Rack-G-$1');
                        rawStr = rawStr.replace(/^Rack-H\s*[-:]\s*(\d+)$/i, 'Rack-H-$1');
                        rawStr = rawStr.replace(/^Rack-I\s*[-:]\s*(\d+)$/i, 'Rack-I-$1');
                        
                        // 如果是 Date 格式字串，解析月與日 (例如 Date(2024,0,2) 會解析成 1-2)
                        if (rawStr.startsWith('Date(')) {
                            const match = rawStr.match(/Date\(\d+,\s*(\d+),\s*(\d+)/);
                            if (match) {
                                const m = parseInt(match[1]) + 1; // GAS Date 月份是 0 起始
                                const d = parseInt(match[2]);
                                rawStr = `${m}-${d}`;
                            }
                        }
                        
                        let rackId = 'Rack-A'; 
                        let shelf = 1; 
                        
                        let rPart, sPart;
                        if (rawStr.startsWith('Rack-')) {
                            const parts = rawStr.split('-');
                            rPart = parts.length >= 2 ? parts[0] + '-' + parts[1] : parts[0];
                            sPart = parts[2];
                        } else {
                            const parts = rawStr.split('-');
                            rPart = parts[0];
                            sPart = parts[1];
                        }
                        
                        if (rPart === '1' || rPart === 'Rack-A') rackId = 'Rack-A';
                        else if (rPart === '2' || rPart === 'Rack-B') rackId = 'Rack-B';
                        else if (rPart === '3' || rPart === 'Rack-C') rackId = 'Rack-C';
                        else if (rPart === '4' || rPart === 'Rack-D') rackId = 'Rack-D';
                        else if (rPart === '5' || rPart === 'Rack-E') rackId = 'Rack-E';
                        else if (rPart === '6' || rPart === 'Rack-F') rackId = 'Rack-F';
                        else if (rPart === '7' || rPart === 'Rack-G') rackId = 'Rack-G';
                        else if (rPart === '8' || rPart === 'Rack-H') rackId = 'Rack-H';
                        else if (rPart === '9' || rPart === 'Rack-I') rackId = 'Rack-I';
                        else if (rPart) {
                            const found = RACKS_CONFIG.find(r => r.id === rPart || r.no.toString() === rPart);
                            if (found) rackId = found.id;
                        }
                        
                        if (sPart && !isNaN(parseInt(sPart))) {
                            let parsedShelf = parseInt(sPart);
                            const maxShelf = (rackId === 'Rack-G' || rackId === 'Rack-H') ? 2 : (rackId === 'Rack-I' ? 1 : 4);
                            if (parsedShelf >= 1 && parsedShelf <= maxShelf) shelf = parsedShelf;
                        }
                        
                        return {
                            id: row.c[0]?.v || '',
                            name: row.c[1]?.v || '',
                            rackId: rackId,
                            shelf: shelf,
                            chName: row.c[3]?.v || '' 
                        };
                    }).filter(m => m.name !== '')
                      .sort((a, b) => a.name.toLowerCase().localeCompare(b.name.toLowerCase(), 'en')); 

                    localStorage.setItem('drugSysRealMedicines', JSON.stringify(this.medicines));

                    this.lastUpdate = new Date().toLocaleString('zh-TW', { hour12: false });
                    DOM.updateLastUpdateTime();
                } catch (error) {
                    const cachedMeds = localStorage.getItem('drugSysRealMedicines');
                    this.medicines = cachedMeds ? JSON.parse(cachedMeds) : [];
                    
                    this.lastUpdate = new Date().toLocaleString('zh-TW', { hour12: false }) + " (連線失敗/離線模式)";
                    DOM.updateLastUpdateTime();
                }
            },

            getFilteredMedicines() {
                return this.medicines.filter(med => {
                    const q = this.searchQuery.toLowerCase();
                    const matchSearch = med.name.toLowerCase().includes(q) || 
                                        (med.chName && med.chName.toLowerCase().includes(q));
                    const matchRack = this.selectedRackId ? (med.rackId === this.selectedRackId) : true;
                    const matchShelf = this.selectedShelf ? (med.shelf === this.selectedShelf) : true;
                    return matchSearch && matchRack && matchShelf;
                }).sort((a, b) => {
                    // 優先依照鐵架代號排序 (例如: 'Rack-A' < 'Rack-B')
                    const rackCompare = a.rackId.localeCompare(b.rackId, 'zh-TW', {numeric: true});
                    if (rackCompare !== 0) {
                        return rackCompare;
                    }
                    // 若鐵架代號相同，則依照層數排序 (1 < 2 < 3 < 4)
                    return a.shelf - b.shelf;
                });
            },

            getHighlightedLocations() {
                if (!this.searchQuery) return []; 
                const q = this.searchQuery.toLowerCase();
                const matchedMeds = this.medicines.filter(med => 
                    med.name.toLowerCase().includes(q) || 
                    (med.chName && med.chName.toLowerCase().includes(q))
                );
                return matchedMeds.map(m => ({ rackId: m.rackId, shelf: m.shelf }));
            },

            async syncRacksToServer(racks) {
                if (!this.WEB_APP_URL) return true;
                try {
                    const payload = { action: 'saveRacks', racks: racks };
                    const response = await fetch(this.WEB_APP_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });
                    const result = await response.json();
                    return result.status === 'success';
                } catch (error) {
                    return false;
                }
            },

            async syncToServer(id, name, rackId, shelf, chName, originalId) {
                if (!this.WEB_APP_URL) {
                    this._updateLocalState(id, name, rackId, shelf, chName, originalId);
                    this.lastUpdate = new Date().toLocaleString('zh-TW', { hour12: false });
                    DOM.updateLastUpdateTime();
                    return true;
                }

                try {
                    const rackObj = RACKS_CONFIG.find(r => r.id === rackId);

                    // 儲存時直接寫入與既有資料庫相同的儲位格式，例如 G/H 使用 7-1、7-2、8-1、8-2。
                    // 不加開頭單引號，避免實際寫入資料變成 '7-2 而造成後續讀取不一致。
                    // A~F 也維持原本的 1-1 ~ 6-4 格式。
                    const rackSaveVal = (rackObj ? rackObj.no : rackId) + '-' + shelf;
                    
                    const payload = {
                        action: 'saveMedicine',
                        id,
                        name,
                        rackId: rackSaveVal,
                        chName,
                        originalId
                    };
                    const response = await fetch(this.WEB_APP_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });
                    const result = await response.json();
                    
                    if (result.status === 'success') {
                        const savedChName = (result.chName !== undefined) ? result.chName : chName;
                        this._updateLocalState(result.id || id, result.name || name, rackId, shelf, savedChName, originalId);
                        this.lastUpdate = new Date().toLocaleString('zh-TW', { hour12: false });
                        DOM.updateLastUpdateTime();
                        return true;
                    } else {
                        alert("儲存失敗：" + result.message);
                        return false;
                    }
                } catch (error) {
                    alert("網路連線錯誤，無法同步至後端！將暫時更新於本地端預覽。");
                    this._updateLocalState(id, name, rackId, shelf, chName, originalId);
                    this.lastUpdate = new Date().toLocaleString('zh-TW', { hour12: false }) + " (本地更新)";
                    DOM.updateLastUpdateTime();
                    return true;
                }
            },

            _updateLocalState(id, name, rackId, shelf, chName, originalId) {
                const searchId = originalId || id;
                const existIndex = this.medicines.findIndex(m => m.id === searchId);
                if (existIndex >= 0) {
                    this.medicines[existIndex] = { id, name, rackId, shelf, chName };
                } else {
                    const newId = id || ('m' + Date.now()); 
                    this.medicines.push({ id: newId, name, rackId, shelf, chName }); 
                }
                localStorage.setItem('drugSysRealMedicines', JSON.stringify(this.medicines));
            },

            async deleteFromServer(id) {
                if (!this.WEB_APP_URL) {
                    this._deleteLocalState(id);
                    this.lastUpdate = new Date().toLocaleString('zh-TW', { hour12: false });
                    DOM.updateLastUpdateTime();
                    return true;
                }

                try {
                    const payload = { action: 'deleteMedicine', id: id };
                    const response = await fetch(this.WEB_APP_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });
                    
                    const text = await response.text();
                    let result;
                    try {
                        result = JSON.parse(text);
                    } catch (e) {
                        throw new Error("後端回傳格式錯誤");
                    }
                    
                    if (result.status === 'success') {
                        this._deleteLocalState(id);
                        this.lastUpdate = new Date().toLocaleString('zh-TW', { hour12: false });
                        DOM.updateLastUpdateTime();
                        return true;
                    } else {
                        alert("刪除失敗：" + result.message);
                        return false;
                    }
                } catch (error) {
                    alert("網路連線錯誤，無法同步至後端！將暫時從本地端刪除。");
                    this._deleteLocalState(id);
                    this.lastUpdate = new Date().toLocaleString('zh-TW', { hour12: false }) + " (本地更新)";
                    DOM.updateLastUpdateTime();
                    return true;
                }
            },
            
            _deleteLocalState(id) {
                this.medicines = this.medicines.filter(m => m.id !== id);
                localStorage.setItem('drugSysRealMedicines', JSON.stringify(this.medicines));
            }
        };

        /**
         * 2. DOM 操作與渲染
         */

            updateLastUpdateTime() {

                        <div id="minimap-rack-${rack.id}" 
                             class="absolute flex items-center justify-center bg-white dark:bg-slate-800 border-[1.5px] border-slate-800 dark:border-slate-400 cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors overflow-hidden"

                        </div>

            renderList(medicines) {
                this.filteredMeds = medicines;
                this.itemHeight = 78; 

                if (!this.virtualScrollWrapper) {
                    this.medicineListContainer.innerHTML = '';
                    
                    this.virtualScrollWrapper = document.createElement('div');
                    this.virtualScrollWrapper.style.position = 'relative';
                    this.virtualScrollWrapper.style.width = '100%';
                    
                    this.virtualScrollNode = document.createElement('div');
                    this.virtualScrollNode.style.position = 'absolute';
                    this.virtualScrollNode.style.top = '0';
                    this.virtualScrollNode.style.left = '0';
                    this.virtualScrollNode.style.right = '0';
                    
                    this.virtualScrollWrapper.appendChild(this.virtualScrollNode);
                    this.medicineListContainer.appendChild(this.virtualScrollWrapper);
                    
                    this.updateVirtualList = () => {
                        if (!this.filteredMeds || this.filteredMeds.length === 0) return;
                        
                        const scrollTop = this.medicineListContainer.scrollTop;
                        const containerHeight = this.medicineListContainer.clientHeight;
                        
                        const startIdx = Math.max(0, Math.floor(scrollTop / this.itemHeight) - 3);
                        const endIdx = Math.min(this.filteredMeds.length, startIdx + Math.ceil(containerHeight / this.itemHeight) + 6);
                        
                        this.virtualScrollNode.style.transform = `translateY(${startIdx * this.itemHeight}px)`;
                        
                        this.virtualScrollNode.innerHTML = this.filteredMeds.slice(startIdx, endIdx).map((med, idx) => {
                            const globalIdx = startIdx + idx;
                            const isKeyboardSelected = AppState.keyboardSelectedIndex === globalIdx;
                            
                            const rackObj = RACKS_CONFIG.find(r => r.id === med.rackId);
                            const rackName = rackObj ? rackObj.name : med.rackId;
                            const displayLocation = rackObj && rackObj.id === 'Rack-I' ? rackName : `${rackName}-${med.shelf}`; 
                            
                            const safeId = med.id ? String(med.id).replace(/'/g, "\\'").replace(/"/g, '&quot;') : '';
                            const safeName = med.name ? String(med.name).replace(/'/g, "\\'").replace(/"/g, '&quot;') : '';
                            const safeChName = med.chName ? String(med.chName).replace(/'/g, "\\'").replace(/"/g, '&quot;') : '';
                            
                            const editBtnHTML = AppState.isLoggedIn ? `
                                        <button class="w-8 h-8 rounded-full bg-slate-50 dark:bg-slate-700/50 text-slate-400 dark:text-slate-400 flex items-center justify-center hover:bg-amber-100 dark:hover:bg-amber-900/50 hover:text-amber-600 dark:hover:text-amber-400 transition-all duration-200 shadow-sm border border-slate-100 dark:border-slate-600 hover:-translate-y-0.5 ml-1" title="編輯資料" onclick="event.stopPropagation(); Controllers.openEditModal('${safeId}', '${safeName}', '${med.rackId}', ${med.shelf}, '${safeChName}')">
                                            <i data-lucide="edit-3" class="w-4 h-4"></i>
                                        </button>
                            ` : '';

                            const activeClass = isKeyboardSelected 
                                ? 'border-primary dark:border-primary ring-2 ring-primary/30 bg-slate-50 dark:bg-slate-700/90 transform translate-x-2 shadow-md z-10' 
                                : 'border-slate-100 dark:border-slate-700 hover:border-primary/50 dark:hover:border-primary/50 hover:shadow-md dark:hover:shadow-slate-900/50 hover:-translate-y-1';

                            return `
                                <div class="bg-white dark:bg-slate-800 p-3.5 rounded-xl shadow-sm border mb-3 cursor-pointer group flex justify-between items-center h-[66px] transition-all duration-200 ${activeClass}" onclick="Controllers.viewRackIn3D('${med.rackId}', ${med.shelf})">
                                    <div class="flex-1 pr-3 overflow-hidden">
                                        <h3 class="font-bold text-slate-800 dark:text-slate-100 text-[15px] group-hover:text-primary dark:group-hover:text-primary transition-colors leading-tight truncate">${med.name}</h3>
                                        ${med.chName ? `<p class="text-xs text-slate-500 dark:text-slate-400 truncate mt-0.5">${med.chName}</p>` : ''}
                                    </div>
                                    <div class="flex items-center gap-2 shrink-0">
                                        <span class="bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 text-[11px] px-2.5 py-1 rounded-md font-medium border border-slate-200 dark:border-slate-600 transition-colors">
                                            ${displayLocation}
                                        </span>
                                        ${editBtnHTML}
                                    </div>
                                </div>
                            `;
                        }).join('');
                        lucide.createIcons({root: this.virtualScrollNode});
                    };
                    
                    this.medicineListContainer.addEventListener('scroll', () => {
                        requestAnimationFrame(this.updateVirtualList);
                    });
                }

                if (medicines.length === 0) {
                    this.virtualScrollWrapper.style.display = 'none';
                    if (!this.emptyStateNode) {
                        this.emptyStateNode = document.createElement('div');
                        this.emptyStateNode.className = "flex flex-col items-center justify-center h-full text-slate-400 dark:text-slate-500 py-10";
                        this.medicineListContainer.appendChild(this.emptyStateNode);
                    }
                    this.emptyStateNode.innerHTML = `
                        <i data-lucide="package-open" class="w-12 h-12 mb-3 opacity-50"></i>
                        <p class="text-center font-medium">找不到符合條件的藥品</p>
                        <p class="text-xs mt-1">請嘗試其他關鍵字或清除鐵架篩選</p>
                    `;
                    this.emptyStateNode.style.display = 'flex';
                    lucide.createIcons({root: this.emptyStateNode});
                    return;
                }

                if (this.emptyStateNode) this.emptyStateNode.style.display = 'none';
                this.virtualScrollWrapper.style.display = 'block';
                this.virtualScrollWrapper.style.height = `${medicines.length * this.itemHeight}px`;
                this.updateVirtualList(); 
            },

            updateRacksVisuals(highlightedLocations, selectedRackId, selectedShelf) {
                const searchColor = window.AppearanceConfig.searchColor;
                const selectColor = window.AppearanceConfig.selectColor;
                const highlightedRackIds = new Set(highlightedLocations.map(l => l.rackId));

                    const nameEl = document.getElementById(`legend-name-${rack.id}`);
                    const catEl = document.getElementById(`legend-cat-${rack.id}`);
                    
                    if (mapEl) {
                        mapEl.style.backgroundColor = '';
                        mapEl.style.borderColor = '';
                        mapEl.classList.remove('opacity-40');
                        mapEl.classList.add('border-slate-800', 'dark:border-slate-400', 'bg-white', 'dark:bg-slate-800');

                        if (tagEl) {
                            tagEl.style.borderColor = '';

                            tagEl.classList.remove('opacity-50', 'scale-95');
                            tagEl.className = "flex items-center gap-1.5 bg-white/90 dark:bg-slate-800/90 border border-slate-200 dark:border-slate-700 px-3 py-1.5 rounded-lg shadow-sm backdrop-blur-sm cursor-pointer hover:-translate-y-0.5 transition-all duration-300";
                            nameEl.style.color = '';
                            nameEl.className = "text-xs font-bold text-slate-700 dark:text-slate-200 transition-colors";
                            catEl.style.color = '';
                            catEl.className = "text-[10px] text-slate-500 dark:text-slate-400 font-medium transition-colors";
                        }

                            mapEl.classList.remove('border-slate-800', 'dark:border-slate-400', 'bg-white', 'dark:bg-slate-800');
                            mapEl.style.borderColor = searchColor;
                            mapEl.style.backgroundColor = searchColor + '40'; 
                            
                            if(legendDot) {
                                legendDot.classList.remove('bg-slate-300', 'dark:bg-slate-600');
                                legendDot.style.backgroundColor = searchColor;
                            }
                            if(tagEl) {
                                tagEl.classList.remove('border-slate-200', 'dark:border-slate-700');
                                tagEl.style.borderColor = searchColor + '80'; 
                            }
                        }

                        if (selectedRackId === rack.id) {
                            mapEl.classList.remove('border-slate-800', 'dark:border-slate-400', 'bg-white', 'dark:bg-slate-800');
                            mapEl.style.borderColor = selectColor;
                            mapEl.style.backgroundColor = selectColor;
                            
                            if(legendDot) {

                            mapEl.classList.add('opacity-40');
                            if(tagEl) tagEl.classList.add('opacity-50', 'scale-95');
                        }
                    }
                });

                if (typeof ThreeApp !== 'undefined') {
                    ThreeApp.updateVisuals(highlightedLocations, selectedRackId, selectedShelf);

            },

            updateStatusText() {
                const searchColor = window.AppearanceConfig.searchColor;
                const selectColor = window.AppearanceConfig.selectColor;

                let text = "顯示所有藥品";
                let dotColorClass = "bg-slate-300 dark:bg-slate-600";
                let dotStyleColor = "";

                if (AppState.selectedRackId) {
                    const rackName = RACKS_CONFIG.find(r => r.id === AppState.selectedRackId)?.name || AppState.selectedRackId;
                    text = `篩選條件: ${rackName}`;
                    if (AppState.selectedShelf) {
                        text += AppState.selectedRackId === 'Rack-I' ? ' 堆置區' : ` 第 ${AppState.selectedShelf} 層`;
                    }
                    dotColorClass = "";
                    dotStyleColor = selectColor;
                    if (AppState.searchQuery) text += ` + 關鍵字 "${AppState.searchQuery}"`;
                } else if (AppState.searchQuery) {
                    text = `正在搜尋: "${AppState.searchQuery}"`;
                    dotColorClass = "";

                } else if (AppState.focusedRackId) {
                    text = "顯示所有藥品 (已於圖中標示所在儲位)";

                    dotStyleColor = selectColor;

                this.statusText.textContent = text;
                this.statusDot.className = `w-2 h-2 rounded-full inline-block ${dotColorClass}`;
                this.statusDot.style.backgroundColor = dotStyleColor;

        /**
         * 3. 互動邏輯控制器
         */
        let searchDebounceTimer;

        const Controllers = {
            handleInput(e) {
                clearTimeout(searchDebounceTimer);
                DOM.searchLoader.classList.remove('hidden');
                DOM.clearSearchBtn.classList.add('hidden');
                
                const dynamicDelay = Math.min(800, Math.max(200, AppState.medicines.length * 0.1));

                searchDebounceTimer = setTimeout(() => {
                    const query = e.target.value.trim();
                    AppState.searchQuery = query;
                    AppState.focusedRackId = null;
                    AppState.focusedShelf = null;
                    AppState.keyboardSelectedIndex = query.length > 0 ? 0 : -1;
                    if (query.length > 0 && AppState.selectedRackId) {
                        AppState.selectedRackId = null; 
                    }
                    this.refreshUI();
                    
                    DOM.searchLoader.classList.add('hidden');
                    if(query) DOM.clearSearchBtn.classList.remove('hidden');
                }, dynamicDelay);
            },

            clearSearch() {
                DOM.searchInput.value = '';
                AppState.searchQuery = '';
                AppState.focusedRackId = null;
                AppState.focusedShelf = null;
                AppState.keyboardSelectedIndex = -1;
                DOM.clearSearchBtn.classList.add('hidden');
                DOM.searchInput.focus();
                this.refreshUI();
                if (typeof ThreeApp !== 'undefined') ThreeApp.resetCamera(); 
            },

            resetAll() {
                DOM.searchInput.value = '';
                AppState.searchQuery = '';
                AppState.selectedRackId = null;
                AppState.selectedShelf = null;
                AppState.focusedRackId = null;
                AppState.focusedShelf = null;
                AppState.keyboardSelectedIndex = -1;
                DOM.clearSearchBtn.classList.add('hidden');
                this.refreshUI();
                if (typeof ThreeApp !== 'undefined') ThreeApp.resetCamera(); 
            },

            handleRackClick(rackId) {
                if (AppState.selectedRackId === rackId) {
                    AppState.selectedRackId = null;
                    AppState.selectedShelf = null;
                    AppState.focusedRackId = null;
                    AppState.focusedShelf = null;
                } else {

            updateKeyboardSelection() {
                const itemHeight = DOM.itemHeight || 78; 
                const container = DOM.medicineListContainer;
                const selectedTop = AppState.keyboardSelectedIndex * itemHeight;
                const selectedBottom = selectedTop + itemHeight;

                if (selectedTop < container.scrollTop) {
                    container.scrollTop = selectedTop;
                } else if (selectedBottom > container.scrollTop + container.clientHeight) {
                    container.scrollTop = selectedBottom - container.clientHeight;
                }

                if (DOM.updateVirtualList) {
                    DOM.updateVirtualList();
                }
            },

            refreshUI() {
                const filteredList = AppState.getFilteredMedicines();
                const highlightedLocations = AppState.getHighlightedLocations();
                
                DOM.renderList(filteredList);
                DOM.updateRacksVisuals(highlightedLocations, AppState.focusedRackId || AppState.selectedRackId, AppState.focusedShelf || AppState.selectedShelf);
                DOM.updateStatusText();
                if(DOM.totalItemsCount) DOM.totalItemsCount.textContent = AppState.medicines.length; 
                
                // 動態渲染層數篩選按鈕
                if (AppState.selectedRackId && !AppState.focusedRackId) {
                    const rack = RACKS_CONFIG.find(r => r.id === AppState.selectedRackId);
                    const rackName = rack ? rack.name : AppState.selectedRackId;
                    let html = '';
                    const shelfCount = (rack && (rack.id === 'Rack-G' || rack.id === 'Rack-H')) ? 2 : (rack && rack.id === 'Rack-I' ? 1 : 4);
                    const shelfNames = (rack && (rack.id === 'Rack-G' || rack.id === 'Rack-H')) ? ['桌面', '上方兩層'] : (rack && rack.id === 'Rack-I' ? ['堆置區'] : null);
                    for(let i=1; i<=shelfCount; i++) {
                        const isActive = AppState.selectedShelf === i;
                        const bgClass = isActive ? 'bg-primary text-white shadow-md transform scale-105' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 border border-slate-200 dark:border-slate-600';
                        // 修正：調整此處的 padding 與文字大小 (px-3 py-1 text-[12px]) 縮小標籤外框
                        const label = shelfNames ? `${rackName}-${shelfNames[i-1]}` : `${rackName}-${i}`;
                        html += `<button onclick="Controllers.handleShelfClick(${i})" class="shrink-0 px-3 py-1 text-[12px] font-bold rounded-full transition-all duration-200 ${bgClass}">${label}</button>`;
                    }
                    DOM.shelfFilterContainer.innerHTML = html;
                    DOM.shelfFilterContainer.classList.remove('hidden');
                } else {
                    DOM.shelfFilterContainer.classList.add('hidden');
                }

            exportBackup() {
                const data = {
                    medicines: AppState.medicines,

                    exportDate: new Date().toISOString()
                };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `藥品庫存備份_${new Date().toLocaleDateString('zh-TW').replace(/\//g, '')}.json`;
                a.click();
                URL.revokeObjectURL(url);
            },

            triggerImportBackup() {
                if (confirm('警告：匯入還原檔將會完全蓋掉目前的所有資料且無法復原！\n請問是否仍要繼續選擇還原檔？')) {
                    const fileInput = document.getElementById('backupFileInput');
                    fileInput.value = ''; 
                    fileInput.click();
                }
            },

            async importBackup(event) {
                const file = event.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = async (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (data.medicines && data.racks) {
                            AppState.medicines = data.medicines;
                            RACKS_CONFIG = data.racks;
                            
                            localStorage.setItem('drugSysRealMedicines', JSON.stringify(AppState.medicines));
                            localStorage.setItem('drugSysRacksConfig', JSON.stringify(RACKS_CONFIG));
                            
                            alert('備份已成功還原至本機！\n(若需覆蓋至雲端，可能需確認後端是否支援或需手動更新)');
                            
                            DOM.renderRackOptions();
                            DOM.renderRacks();
                            if (typeof ThreeApp !== 'undefined') {
                                ThreeApp.rebuildAllRacks();
                            }
                            this.refreshUI();
                            this.closeSettingsModal();
                        } else {
                            alert('備份檔案格式不正確！');
                        }
                    } catch (err) {
                        alert('讀取檔案失敗！');
                    }
                    event.target.value = ''; 
                };
                reader.readAsText(file);
            },
