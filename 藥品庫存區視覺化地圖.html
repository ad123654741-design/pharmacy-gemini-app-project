                            font-weight: 900;
                            color: #1d4ed8;
                            margin-bottom: 2px;
                            white-space: nowrap;
                            overflow: hidden;
                            text-overflow: ellipsis;
                        }
                        .st-ch {
                            font-size: 11px;
                            color: #047857;
                            font-weight: bold;
                            white-space: nowrap;
                            overflow: hidden;
                            text-overflow: ellipsis;
                        }

                        @media print {
                            body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
                            .sticker { border: none; } /* 列印時隱藏預覽框線 */
                        }
                    </style>
                </head>
                <body>
                `;

                // 分頁邏輯：每 30 張 (3x10) 分一頁
                const itemsPerPage = 30;
                for (let i = 0; i < targetMedicines.length; i += itemsPerPage) {
                    const pageItems = targetMedicines.slice(i, i + itemsPerPage);
                    
                    htmlContent += `<div class="page-container">`;
                    
                    pageItems.forEach(med => {
                        htmlContent += `
                            <div class="sticker">
                                <div class="st-code">${med.id || 'N/A'}</div>
                                <div class="st-name">${med.name}</div>
                                <div class="st-ch">${med.chName || ''}</div>
                            </div>
                        `;
                    });
                    
                    htmlContent += `</div>`;
                }

                htmlContent += `
                    <script>
                        window.onload = () => { setTimeout(() => { window.print(); }, 500); };
                    <\/script>
                </body>
                </html>`;

                printWindow.document.write(htmlContent);
                printWindow.document.close();
            }
        };

        /**
         * 4. Three.js 3D 視覺化
         */
        const ThreeApp = {
            scene: null, camera: null, renderer: null,
            racksGroup: null, labelsGroup: null, boxesGroup: null,
            rackMeshes: {}, 
            boxMeshes: [],
            
            // 預設攝影機視角與中心點
            defaultCamPos: new THREE.Vector3(22, 26, 22),
            defaultTarget: new THREE.Vector3(0, 0, 2),

            init() {
                const container = document.getElementById('canvas-container');
                
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(document.documentElement.classList.contains('dark') ? 0x0f172a : 0xf1f5f9);

                this.camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 200);
                this.camera.position.copy(this.defaultCamPos);

                this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                container.appendChild(this.renderer.domElement);

                // 燈光設定
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
                this.scene.add(ambientLight);

                const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
                dirLight.position.set(10, 20, 10);
                dirLight.castShadow = true;
                dirLight.shadow.mapSize.width = 2048;
                dirLight.shadow.mapSize.height = 2048;
                dirLight.shadow.camera.near = 0.5;
                dirLight.shadow.camera.far = 50;
                dirLight.shadow.camera.left = -20;
                dirLight.shadow.camera.right = 20;
                dirLight.shadow.camera.top = 20;
                dirLight.shadow.camera.bottom = -20;
                dirLight.shadow.bias = -0.001;
                this.scene.add(dirLight);
                
                const fillLight = new THREE.DirectionalLight(0xe0e7ff, 0.4);
                fillLight.position.set(-10, 10, -10);
                this.scene.add(fillLight);

                // 地板與環境
                this.floorMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.8, emissive: 0xffffff, emissiveIntensity: 0.1 });
                // 白色實體網格，向外推至 30，中心 Z 偏移 2
                const floorGeo = new THREE.PlaneGeometry(30, 30);
                this.floor = new THREE.Mesh(floorGeo, this.floorMat);
                this.floor.rotation.x = -Math.PI / 2;
                this.floor.receiveShadow = true;
                this.floor.position.z = 2;
                this.scene.add(this.floor);

                const isDark = document.documentElement.classList.contains('dark');
                // 內部主要格線
                this.innerGrid = new THREE.GridHelper(30, 30, isDark ? 0x334155 : 0xe2e8f0, isDark ? 0x1e293b : 0xe2e8f0);
                this.innerGrid.position.y = 0.01;
                this.innerGrid.position.z = 2;
                this.scene.add(this.innerGrid);
                
                // 外部透明延伸格線 (向外 2 格 = 34)
                this.outerGrid = new THREE.GridHelper(34, 34, isDark ? 0x1e293b : 0xe2e8f0, isDark ? 0x1e293b : 0xd1d5db);
                this.outerGrid.position.y = 0.005;
                this.outerGrid.position.z = 2; 
                this.outerGrid.material.transparent = true;
                this.outerGrid.material.opacity = 0.4;
                this.scene.add(this.outerGrid);

                // 走道平面
                this.aisleMat = new THREE.MeshStandardMaterial({ color: 0xabc2d8, roughness: 0.9 });
                const aisleGeo = new THREE.PlaneGeometry(30, 3.2); 
                const aisle = new THREE.Mesh(aisleGeo, this.aisleMat);
                aisle.rotation.x = -Math.PI / 2;
                aisle.position.y = 0.02;
                aisle.position.z = 0; // 配合壓縮後的新比例，走道回到 Z=0
                this.scene.add(aisle);

                this.boxBaseMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.9, metalness: 0.05 });
                this.boxGlowMat = new THREE.MeshStandardMaterial({ color: 0x10b981, emissive: 0x10b981, emissiveIntensity: 0.2, roughness: 0.2 });

                this.racksGroup = new THREE.Group();
                this.boxesGroup = new THREE.Group();
                this.labelsGroup = new THREE.Group();
                
                this.scene.add(this.racksGroup);
                this.scene.add(this.boxesGroup);
                this.scene.add(this.labelsGroup);

                this.buildRacks();
                this.createLabels();

                // 滑鼠控制與 Raycaster
                this.raycaster = new THREE.Raycaster();
                this.mouse = new THREE.Vector2();
                this.isDragging = false;
                this.previousMousePosition = { x: 0, y: 0 };
                
                this.targetCamPos = this.camera.position.clone();
                this.targetLookAt = this.defaultTarget.clone();
                this.currentLookAt = this.defaultTarget.clone();

                this.setupInteraction(container);

                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                    this.updateLabelsPosition();
                });

                this.applyAppearance();
                this.animate();
            },

            applyAppearance() {
                const config = window.AppearanceConfig;
                const isDark = document.documentElement.classList.contains('dark');

                // 地板
                let fColor = 0xffffff;
                if(config.floorColor === 'gray') fColor = 0xd1d5db;
                else if(config.floorColor === 'wood') fColor = 0xeaddcf;
                else if(config.floorColor === 'dark') fColor = 0x334155;
                
                if(isDark && config.floorColor === 'white') fColor = 0x1e293b;
                
                this.floorMat.color.setHex(fColor);
                this.floorMat.emissive.setHex(fColor);
                this.floorMat.emissiveIntensity = isDark ? 0.05 : 0.1;

                // 走道
                this.aisleMat.visible = true;
                if(this.carpetBorders) this.carpetBorders.visible = false;

                if (config.aisleColor === 'gray') this.aisleMat.color.setHex(0xabc2d8);
                else if (config.aisleColor === 'blue') this.aisleMat.color.setHex(0x93c5fd);
                else if (config.aisleColor === 'red') this.aisleMat.color.setHex(0xe11d48);
                else if (config.aisleColor === 'none') this.aisleMat.visible = false;

                if (config.aisleColor === 'red') {
                    if (!this.carpetBorders) {
                        const borderGeo = new THREE.BoxGeometry(30, 0.1, 0.2); 
                        const borderMat = new THREE.MeshStandardMaterial({color: 0xffd700, metalness: 0.8, roughness: 0.2});
                        const border1 = new THREE.Mesh(borderGeo, borderMat);
                        border1.position.set(0, 0.05, 1.5); 
                        const border2 = new THREE.Mesh(borderGeo, borderMat);
                        border2.position.set(0, 0.05, -1.5);
                        this.carpetBorders = new THREE.Group();
                        this.carpetBorders.add(border1, border2);
                        // 星光紅毯邊框也回到 Z=0
                        this.carpetBorders.position.z = 0; 
                        this.scene.add(this.carpetBorders);
                    }
                    this.carpetBorders.visible = true;
                }

                // 更新現有發光材質
                this.boxGlowMat.emissiveIntensity = config.glowIntensity;
                Controllers.refreshUI();
            },

            updateTheme() {
                const isDark = document.documentElement.classList.contains('dark');
                this.scene.background = new THREE.Color(isDark ? 0x0f172a : 0xf1f5f9);
                
                this.innerGrid.material.color.setHex(isDark ? 0x334155 : 0xe2e8f0);
                this.outerGrid.material.color.setHex(isDark ? 0x1e293b : 0xe2e8f0);
                
                this.applyAppearance();
            },

            buildRacks() {
                // 清除舊物件
                while(this.racksGroup.children.length > 0){ this.racksGroup.remove(this.racksGroup.children[0]); }
                while(this.boxesGroup.children.length > 0){ this.boxesGroup.remove(this.boxesGroup.children[0]); }
                this.rackMeshes = {};
                this.boxMeshes = [];

                const roomW = 28; 
                // 將 roomD 維持在 24，避免鐵架距離被過度拉伸
                const roomD = 24; 

                const rackMat = new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.8, roughness: 0.2 });
                const shelfMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.3, roughness: 0.6 });

                RACKS_CONFIG.forEach(rackData => {
                    // 解析百分比
                    const leftPerc = parseFloat(rackData.left) / 100;
                    const topPerc = parseFloat(rackData.top) / 100;
                    const wPerc = parseFloat(rackData.width) / 100;
                    const hPerc = parseFloat(rackData.height) / 100;

                    const width = wPerc * roomW;
                    const depth = hPerc * roomD;
                    const height = 4.0; 

                    // 映射座標 (將 (0,0) 放左上，對應到 3D 空間的 (-X, -Z))
                    const x = (leftPerc + wPerc/2) * roomW - roomW/2;
                    const z = (topPerc + hPerc/2) * roomD - roomD/2;

                    const rackObj = new THREE.Group();
                    rackObj.position.set(x, 0, z);

                    // 鐵柱
                    const pR = 0.05;
                    const pGeo = new THREE.CylinderGeometry(pR, pR, height, 8);
                    const p1 = new THREE.Mesh(pGeo, rackMat); p1.position.set(-width/2, height/2, -depth/2);
                    const p2 = new THREE.Mesh(pGeo, rackMat); p2.position.set(width/2, height/2, -depth/2);
                    const p3 = new THREE.Mesh(pGeo, rackMat); p3.position.set(-width/2, height/2, depth/2);
                    const p4 = new THREE.Mesh(pGeo, rackMat); p4.position.set(width/2, height/2, depth/2);
                    [p1,p2,p3,p4].forEach(p => { p.castShadow = true; rackObj.add(p); });

                    // 4 層層板
                    const shelfCount = 4;
                    const sH = 0.1;
                    const sGeo = new THREE.BoxGeometry(width, sH, depth);
                    
                    // 用於記錄該鐵架的 4 個層板發光 Mesh，儲存於 rackMeshes[rack.id].shelfGlows[1~4]
                    const shelfGlows = {};

                    for(let i=0; i<shelfCount; i++) {
                        const y = 0.3 + i * ((height - 0.5) / (shelfCount - 1));
                        const shelfMesh = new THREE.Mesh(sGeo, shelfMat);
                        shelfMesh.position.y = y;
                        shelfMesh.castShadow = true;
                        shelfMesh.receiveShadow = true;
                        rackObj.add(shelfMesh);

                        // 加入假紙箱
                        this.addBoxesToShelf(x, y, z, width, depth, rackData.id, i+1);
                        
                        // 加入隱形的「發光選取框」(單層發光)
                        const glowGeo = new THREE.BoxGeometry(width + 0.1, (height - 0.5) / shelfCount - 0.1, depth + 0.1);
                        const glowMesh = new THREE.Mesh(glowGeo, this.boxGlowMat);
                        // 讓發光框包覆紙箱區域
                        glowMesh.position.set(0, y + ((height - 0.5) / shelfCount) / 2 - 0.2, 0);
                        glowMesh.visible = false; // 預設隱藏
                        rackObj.add(glowMesh);
                        
                        shelfGlows[i+1] = glowMesh;
                    }

                    this.racksGroup.add(rackObj);
                    
                    // 為了相容點擊鐵架主體的射線偵測，加入一個透明的大碰撞框
                    const hitBoxGeo = new THREE.BoxGeometry(width, height, depth);
                    const hitBoxMat = new THREE.MeshBasicMaterial({visible: false});
                    const hitBox = new THREE.Mesh(hitBoxGeo, hitBoxMat);
                    hitBox.position.y = height/2;
                    hitBox.userData = { rackId: rackData.id };
                    rackObj.add(hitBox);

                    this.rackMeshes[rackData.id] = {
                        group: rackObj,
                        hitBox: hitBox,
                        shelfGlows: shelfGlows,
                        center: new THREE.Vector3(x, height/2, z)
                    };
                });
            },

            addBoxesToShelf(cx, cy, cz, w, d, rackId, shelfNum) {
                // 產生看似隨機但固定的紙箱
                const hash = (cx + cy + cz) * 1000;
                const seed = Math.abs(Math.sin(hash));
                
                const boxCount = Math.floor(seed * 3) + 2; 
                const margin = 0.2;
                const useW = w - margin*2;
                const useD = d - margin*2;

                for(let i=0; i<boxCount; i++) {
                    const bw = 0.4 + (Math.sin(hash + i) * 0.5 + 0.5) * 0.4;
                    const bd = 0.4 + (Math.cos(hash + i) * 0.5 + 0.5) * 0.4;
                    const bh = 0.3 + (Math.sin(hash - i) * 0.5 + 0.5) * 0.4;

                    const bx = (Math.sin(hash * i * 1.3) * (useW - bw)/2);
                    const bz = (Math.cos(hash * i * 1.7) * (useD - bd)/2);

                    const boxGeo = new THREE.BoxGeometry(bw, bh, bd);
                    const box = new THREE.Mesh(boxGeo, this.boxBaseMat);
                    
                    // 座標是相對於世界的
                    box.position.set(cx + bx, cy + bh/2 + 0.05, cz + bz);
                    box.castShadow = true;
                    box.receiveShadow = true;
                    
                    // 標記這顆紙箱屬於哪個層架哪一層，以備不時之需
                    box.userData = { rackId: rackId, shelf: shelfNum };
                    
                    this.boxesGroup.add(box);
                    this.boxMeshes.push({ mesh: box, rackId: rackId, shelf: shelfNum });
                }
            },

            createLabels() {
                const container = document.getElementById('labels-container');
                container.innerHTML = '';
                
                RACKS_CONFIG.forEach(rack => {
                    const el = document.createElement('div');
                    el.className = 'rack-label-3d';
                    el.textContent = `${rack.name}${rack.category ? ` (${rack.category})` : ''}`;
                    el.id = `label3d-${rack.id}`;
                    el.onclick = () => Controllers.handleRackClick(rack.id);
                    container.appendChild(el);
                    rack.labelEl = el;
                });
                this.updateLabelsPosition();
            },

            updateLabelsPosition() {
                const widthHalf = window.innerWidth / 2;
                const heightHalf = window.innerHeight / 2;

                RACKS_CONFIG.forEach(rack => {
                    if (this.rackMeshes[rack.id] && rack.labelEl) {
                        const pos = this.rackMeshes[rack.id].center.clone();
                        pos.y += 2.5; 
                        pos.project(this.camera);

                        // 判斷是否在相機前方
                        if (pos.z > 1) {
                            rack.labelEl.style.display = 'none';
                            return;
                        }

                        const x = (pos.x * widthHalf) + widthHalf;
                        const y = -(pos.y * heightHalf) + heightHalf;

                        rack.labelEl.style.display = 'block';
                        rack.labelEl.style.left = `${x}px`;
                        rack.labelEl.style.top = `${y}px`;
                        
                        // Z-index 排序，近的在上面
                        rack.labelEl.style.zIndex = Math.floor((1 - pos.z) * 100);
                    }
                });
            },

            setupInteraction(container) {
                container.addEventListener('mousedown', (e) => {
                    if(e.button !== 0) return; // 僅左鍵
                    this.isDragging = true;
                    this.previousMousePosition = { x: e.offsetX, y: e.offsetY };
                });

                container.addEventListener('mousemove', (e) => {
                    if (this.isDragging) {
                        const deltaMove = {
                            x: e.offsetX - this.previousMousePosition.x,
                            y: e.offsetY - this.previousMousePosition.y
                        };

                        // 旋轉攝影機位置 (相對於目標點)
                        const offset = this.targetCamPos.clone().sub(this.targetLookAt);
                        
                        // 左右旋轉 (繞 Y 軸)
                        const theta = -deltaMove.x * 0.01;
                        offset.applyAxisAngle(new THREE.Vector3(0, 1, 0), theta);

                        // 上下旋轉 (調整高度)
                        offset.y += deltaMove.y * 0.05;
                        // 限制高度
                        offset.y = Math.max(2, Math.min(30, offset.y));

                        // 更新目標位置
                        this.targetCamPos.copy(this.targetLookAt).add(offset);
                        
                        this.previousMousePosition = { x: e.offsetX, y: e.offsetY };
                    }
                });

                window.addEventListener('mouseup', () => { this.isDragging = false; });
                
                // 滾輪縮放
                container.addEventListener('wheel', (e) => {
                    const offset = this.targetCamPos.clone().sub(this.targetLookAt);
                    const distance = offset.length();
                    
                    const zoomDelta = e.deltaY * 0.02;
                    let newDistance = distance + zoomDelta;
                    newDistance = Math.max(5, Math.min(60, newDistance)); // 限制距離
                    
                    offset.setLength(newDistance);
                    this.targetCamPos.copy(this.targetLookAt).add(offset);
                }, { passive: true });

                // 點擊物體偵測
                container.addEventListener('click', (e) => {
                    // 若有拖曳則不視為點擊
                    if(Math.abs(e.offsetX - this.previousMousePosition.x) > 2 || 
                       Math.abs(e.offsetY - this.previousMousePosition.y) > 2) {
                        return;
                    }

                    this.mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                    this.mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

                    this.raycaster.setFromCamera(this.mouse, this.camera);
                    
                    // 收集所有碰撞框
                    const hitBoxes = Object.values(this.rackMeshes).map(r => r.hitBox);
                    const intersects = this.raycaster.intersectObjects(hitBoxes);

                    if (intersects.length > 0) {
                        const hitId = intersects[0].object.userData.rackId;
                        Controllers.handleRackClick(hitId);
                    }
                });
            },

            // locations: [{rackId: 'Rack-A', shelf: 1}, ...]
            highlightRacks(locations, selectedRackId, selectedShelf) {
                const conf = window.AppearanceConfig;
                
                // 重設所有發光框
                Object.values(this.rackMeshes).forEach(rackData => {
                    Object.values(rackData.shelfGlows).forEach(glow => {
                        glow.visible = false;
                    });
                });
                
                // 處理 UI 標籤的 Active 狀態
                RACKS_CONFIG.forEach(rack => {
                    if (rack.labelEl) rack.labelEl.classList.remove('active-label');
                    if (rack.id === selectedRackId && rack.labelEl) {
                        rack.labelEl.classList.add('active-label');
                    }
                });

                // 若有選取特定層架 (Focus 或 Select)
                if (selectedRackId) {
                    const rackData = this.rackMeshes[selectedRackId];
                    if (rackData) {
                        this.boxGlowMat.color.setHex(parseInt(conf.selectColor.replace('#', '0x')));
                        this.boxGlowMat.emissive.setHex(parseInt(conf.selectColor.replace('#', '0x')));
                        
                        if (selectedShelf) {
                            // 單層發亮
                            if(rackData.shelfGlows[selectedShelf]) rackData.shelfGlows[selectedShelf].visible = true;
                        } else {
                            // 整櫃發亮
                            Object.values(rackData.shelfGlows).forEach(glow => glow.visible = true);
                        }
                    }
                } 
                // 若為全域搜尋模式 (無單獨選取)
                else if (locations.length > 0) {
                    this.boxGlowMat.color.setHex(parseInt(conf.searchColor.replace('#', '0x')));
                    this.boxGlowMat.emissive.setHex(parseInt(conf.searchColor.replace('#', '0x')));
                    
                    locations.forEach(loc => {
                        const rackData = this.rackMeshes[loc.rackId];
                        if (rackData && loc.shelf && rackData.shelfGlows[loc.shelf]) {
                            rackData.shelfGlows[loc.shelf].visible = true;
                        }
                    });
                }
            },

            focusOnRack(rackId) {
                const meshData = this.rackMeshes[rackId];
                if (meshData) {
                    const target = meshData.center;
                    this.targetLookAt.copy(target);
                    
                    // 將鏡頭移至該鐵架正前方微斜上
                    const offset = new THREE.Vector3(0, 5, 8); // 固定相對偏移
                    this.targetCamPos.copy(target).add(offset);
                }
            },

            resetCamera() {
                this.targetCamPos.copy(this.defaultCamPos);
                this.targetLookAt.copy(this.defaultTarget);
                // 同時取消所有選取狀態
                Controllers.clearSearch();
            },

            animate() {
                requestAnimationFrame(this.animate.bind(this));

                // 平滑插值相機位置與目標點
                this.camera.position.lerp(this.targetCamPos, 0.05);
                this.currentLookAt.lerp(this.targetLookAt, 0.05);
                this.camera.lookAt(this.currentLookAt);

                this.renderer.render(this.scene, this.camera);
                this.updateLabelsPosition(); // 每幀更新 2D 標籤位置
            }
        };

        // 啟動應用程式
        window.onload = () => {
            lucide.createIcons();
            Controllers.init();
            ThreeApp.init();
        };

    </script>
